<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おぼログ - 学習モード</title>
  <link rel="stylesheet" href="card.css">
  <script src="card.js" defer></script>
</head>
<body>

<div class="quiz-container">
  <div class="header">
    <button class="exit-btn" onclick="exitQuiz()">✕</button>
    <div class="quiz-progress-bar-track">
      <div class="quiz-progress-bar-fill" id="quiz-progress-fill"></div>
    </div>
    <div class="quiz-streak">🔥 <span id="quiz-streak-count">0</span></div>
  </div>

  <div id="quiz-area">
    <div class="question-header">
      <h2 id="question-type-label">意味を選んでください</h2>
      <div class="question-word" id="display-word">...</div>
    </div>

    <div id="choice-area" class="choice-grid" style="display:none;"></div>

    <div id="typing-area" class="typing-container" style="display:none;">
      <input type="text" id="typing-input" placeholder="スペルを入力..." autocomplete="off">
    </div>
  </div>

  <div id="quiz-summary" class="summary-container" style="display:none;">
    <h1>レッスン完了！</h1>
    <div class="summary-stats">
      <div class="stat-card">
        <div class="stat-val" id="summary-score">0</div>
        <div class="stat-label">獲得XP</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="summary-accuracy">0%</div>
        <div class="stat-label">正解率</div>
      </div>
    </div>
    <button class="finish-btn" onclick="saveAndExit()">保存して終了</button>
  </div>
</div>

<div id="feedback-panel" class="feedback-panel">
  <div class="feedback-content-wrapper">
    <div class="feedback-text">
      <div id="feedback-message">正解です！</div>
      <div id="correct-answer-display"></div>
    </div>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()">次へ</button>
  </div>
</div>

</body>
</html>
