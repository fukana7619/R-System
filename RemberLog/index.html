<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おぼログ - ホーム</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>

<div class="header">
  <h1>📖 おぼログ Dashboard</h1>
  <div class="header-right">
    <button class="refresh-btn" onclick="syncAllData()">最新データの同期</button>
    <button class="logout-btn" onclick="logout()">ログアウト</button>
  </div>
</div>

<div class="main-layout">
  <div class="left-col">
    <div class="card">
      <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">
        ユーザー: <strong><span id="display-user">...</span></strong>
      </div>
      <div class="form-group">
        <label for="dictionary-select">学習する単語帳 (ISBN)</label>
        <select id="dictionary-select" onchange="onDictionaryChange()">
          </select>
      </div>
      <button class="submit-btn" style="margin-top: 8px; background-color: #10b981;" onclick="startQuiz()">
        🚀 この単語帳で学習を始める
      </button>
    </div>

    <div class="card">
      <h3>📊 学習アナリティクス</h3>
      <div class="dash-box" style="margin-bottom: 8px;">
        <div class="dash-title">総学習単語数</div>
        <div class="dash-value" id="total-learned-count">0語</div>
      </div>
      <div class="dash-box" style="margin-bottom: 8px;">
        <div class="dash-title">選択中単語帳の達成度</div>
        <div class="dash-value" id="current-progress-rate">0%</div>
      </div>
      <div class="dash-box">
        <div class="dash-title">連続学習日数</div>
        <div class="dash-value" id="streak-days">0日</div>
      </div>
    </div>
  </div>

  <div class="right-col">
    <div class="card">
      <h3 id="book-title">単語帳の概要</h3>
      <p id="book-description" style="font-size: 0.9rem; color: #64748b; margin-bottom: 12px;">データ取得中...</p>
      
      <h4>収録単語一覧 (プレビュー)</h4>
      <div class="table-container" style="max-height: 400px; overflow-y: auto;">
        <table id="word-preview-table" class="data-table">
          <thead>
            <tr>
              <th>単語</th>
              <th>意味</th>
              <th>カテゴリ</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="loading-overlay" class="loading-overlay" style="display: none;">
  <div class="spinner"></div>
</div>

</body>
</html>
