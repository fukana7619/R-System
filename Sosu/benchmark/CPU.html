<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPU 素数計算ベンチマーク</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* CPUベンチマーク固有のスコアデザイン */
    .score-card {
      background: var(--card-bg, #1e293b);
      border: 1px solid var(--border-color, #334155);
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .score-card h2 {
      margin: 0;
      font-size: 14px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .score-value {
      font-size: 56px;
      font-weight: 800;
      color: #4ade80;
      margin: 10px 0 0 0;
      font-family: monospace;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .metric-box {
      background: var(--card-bg, #1e293b);
      border: 1px solid var(--border-color, #334155);
      border-radius: 8px;
      padding: 15px;
    }
    .metric-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
    }
    .metric-value {
      font-size: 20px;
      font-weight: bold;
      color: #f1f5f9;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="page-nav">
    <a href="../index.html" class="nav-btn">🏠 メイン画面へ戻る</a>
    <a href="GPU.html" class="nav-btn gpu">⚡ GPUモードへ</a>
  </div>

  <h1>CPU 素数計算ベンチマーク</h1>
  <p style="text-align: center; color: #94a3b8; margin-top: -10px; margin-bottom: 20px;">
    描画オーバーヘッドなしの純粋CPU演算性能測定
  </p>

  <div class="controls">
    <button id="startBtn">▶ ベンチマーク開始</button>
    <button id="stopBtn" disabled>⏹ 終了</button>
  </div>

  <div class="score-card">
    <h2>Current CPU Score</h2>
    <div class="score-value"><span id="currentScore">0</span> <span style="font-size: 24px;">pts</span></div>
  </div>

  <div class="metrics-grid">
    <div class="metric-box">
      <div class="metric-label">最高スコア (MAX)</div>
      <div class="metric-value"><span id="maxScore">0</span> pts</div>
    </div>
    <div class="metric-box">
      <div class="metric-label">最低スコア (MIN)</div>
      <div class="metric-value"><span id="minScore">0</span> pts</div>
    </div>
    <div class="metric-box">
      <div class="metric-label">現在探索中の数値</div>
      <div class="metric-value" id="currentNum">2</div>
    </div>
    <div class="metric-box">
      <div class="metric-label">処理スピード</div>
      <div class="metric-value"><span id="speed">0</span> 件/秒</div>
    </div>
  </div>
</div>

<script>
  // --- 1. バックグラウンド計算専用Worker ---
  const workerScript = `
    let isRunning = false;
    let currentNumber = 2;

    function checkPrimeWithOps(num) {
      if (num <= 1) return 1;
      if (num === 2) return 1;
      if (num % 2 === 0) return 1;
      
      let ops = 2;
      const sqrt = Math.sqrt(num);
      for (let i = 3; i <= sqrt; i += 2) {
        ops++;
        if (num % i === 0) break;
      }
      return ops;
    }

    function loop() {
      if (!isRunning) return;

      let checked = 0;
      let opsTotal = 0;
      
      const startTime = performance.now();
      while (performance.now() - startTime < 50) {
        opsTotal += checkPrimeWithOps(currentNumber);
        checked++;
        currentNumber++;
      }

      postMessage({
        checkedCount: checked,
        opsCount: opsTotal,
        current: currentNumber
      });

      if (isRunning) {
        setTimeout(loop, 0);
      }
    }

    onmessage = function(e) {
      if (e.data === 'start') {
        isRunning = true;
        currentNumber = 2;
        loop();
      } else if (e.data === 'stop') {
        isRunning = false;
      }
    };
  `;

  // --- 2. メインスレッド処理 ---
  let worker = null;
  let workerUrl = null;

  let checkedCountInSec = 0;
  let opsCountInSec = 0;
  let currentExploringNum = 2;

  let maxScore = 0;
  let minScore = Infinity;
  let monitorTimer = null;
  let isWarmup = true;

  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');

  const currentScoreEl = document.getElementById('currentScore');
  const maxScoreEl = document.getElementById('maxScore');
  const minScoreEl = document.getElementById('minScore');
  const currentNumEl = document.getElementById('currentNum');
  const speedEl = document.getElementById('speed');

  function startMonitoring() {
    isWarmup = true;
    
    monitorTimer = setInterval(() => {
      speedEl.textContent = checkedCountInSec.toLocaleString();
      currentNumEl.textContent = currentExploringNum.toLocaleString();

      if (opsCountInSec > 0) {
        const rawScore = Math.round(opsCountInSec / 10000);
        currentScoreEl.textContent = rawScore.toLocaleString();

        if (!isWarmup) {
          if (rawScore > maxScore) {
            maxScore = rawScore;
            maxScoreEl.textContent = maxScore.toLocaleString();
          }
          if (rawScore < minScore) {
            minScore = rawScore;
            minScoreEl.textContent = minScore.toLocaleString();
          }
        } else {
          isWarmup = false;
        }
      }

      checkedCountInSec = 0;
      opsCountInSec = 0;
    }, 1000);
  }

  function stopMonitoring() {
    if (monitorTimer) {
      clearInterval(monitorTimer);
      monitorTimer = null;
    }
  }

  startBtn.addEventListener('click', () => {
    maxScore = 0;
    minScore = Infinity;
    checkedCountInSec = 0;
    opsCountInSec = 0;
    
    currentScoreEl.textContent = "0";
    maxScoreEl.textContent = "0";
    minScoreEl.textContent = "0";

    const blob = new Blob([workerScript], { type: 'application/javascript' });
    workerUrl = URL.createObjectURL(blob);
    worker = new Worker(workerUrl);

    worker.onmessage = function(e) {
      checkedCountInSec += e.data.checkedCount;
      opsCountInSec += e.data.opsCount;
      currentExploringNum = e.data.current;
    };

    worker.postMessage('start');
    startMonitoring();

    startBtn.disabled = true;
    stopBtn.disabled = false;
  });

  stopBtn.addEventListener('click', () => {
    if (worker) {
      worker.postMessage('stop');
      worker.terminate();
      worker = null;
    }
    if (workerUrl) {
      URL.revokeObjectURL(workerUrl);
      workerUrl = null;
    }
    stopMonitoring();

    if (minScore === Infinity) {
      minScoreEl.textContent = "0";
    }

    speedEl.textContent = "0";
    startBtn.disabled = false;
    stopBtn.disabled = true;
  });
</script>

</body>
</html>
