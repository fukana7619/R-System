<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無限素数ジェネレーター (LocalDB & Web Worker)</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f4f4f9;
    }
    h1 { color: #333; }
    .controls { margin-bottom: 15px; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
    }
    #resetBtn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #resetBtn:hover { background-color: #cc0000; }
    #resetBtn:disabled { background-color: #ccc; }
    
    .status-panel {
      background: #fff;
      padding: 15px;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .status-panel p { margin: 5px 0; }
    
    #result {
      height: 300px;
      overflow-y: scroll;
      background: #1e1e1e;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 15px;
      border-radius: 5px;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1>無限素数ジェネレーター</h1>
  
  <div class="controls">
    <button id="startBtn">開始 / 再開</button>
    <button id="pauseBtn" disabled>一時停止</button>
    <button id="resetBtn">データリセット</button>
  </div>

  <div class="status-panel">
    <div>
      <p>ステータス: <strong><span id="status">停止中</span></strong></p>
      <p>現在探索中の数値: <strong><span id="current">2</span></strong></p>
      <p>発見した素数の総数: <strong><span id="count">0</span></strong></p>
    </div>
    <div>
      <p>描画パフォーマンス: <strong><span id="fps">60</span> FPS</strong></p>
      <p>JSメモリ使用量: <strong><span id="memory">--</span> MB</strong></p>
    </div>
  </div>

  <div id="result"></div>

  <script>
    // --- 1. Worker用のスクリプト文字列を定義 ---
    const workerScript = `
      let db = null;
      let currentNumber = 2;
      let isRunning = false;

      function initDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("PrimeDatabase", 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("primes")) {
              db.createObjectStore("primes", { autoIncrement: true });
            }
          };
          request.onsuccess = (e) => {
            db = e.target.result;
            resolve(db);
          };
          request.onerror = (e) => reject(e);
        });
      }

      function loadLastState() {
        return new Promise((resolve) => {
          if (!db) return resolve({ lastPrime: 2, totalCount: 0 });
          const transaction = db.transaction(["primes"], "readonly");
          const store = transaction.objectStore("primes");
          
          let totalCount = 0;
          let lastPrime = 2;

          const countReq = store.count();
          countReq.onsuccess = () => {
            totalCount = countReq.result;
            const cursorReq = store.openCursor(null, "prev");
            cursorReq.onsuccess = (e) => {
              const cursor = e.target.result;
              if (cursor) {
                lastPrime = cursor.value;
                currentNumber = lastPrime + 1;
              } else {
                currentNumber = 2;
              }
              resolve({ lastPrime, totalCount });
            };
            cursorReq.onerror = () => resolve({ lastPrime: 2, totalCount: 0 });
          };
          countReq.onerror = () => resolve({ lastPrime: 2, totalCount: 0 });
        });
      }

      function isPrime(num) {
        if (num <= 1) return false;
        if (num === 2) return true;
        if (num % 2 === 0) return false;
        const sqrt = Math.sqrt(num);
        for (let i = 3; i <= sqrt; i += 2) {
          if (num % i === 0) return false;
        }
        return true;
      }

      function saveToDB(primes) {
        return new Promise((resolve) => {
          if (!db || primes.length === 0) return resolve();
          const transaction = db.transaction(["primes"], "readwrite");
          const store = transaction.objectStore("primes");
          primes.forEach(prime => store.add(prime));
          
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => resolve();
        });
      }

      async function calculate() {
        if (!isRunning) return;

        let foundPrimes = [];
        for (let i = 0; i < 1000; i++) {
          if (isPrime(currentNumber)) {
            foundPrimes.push(currentNumber);
          }
          currentNumber++;
        }

        await saveToDB(foundPrimes);

        postMessage({
          type: 'progress',
          primes: foundPrimes,
          current: currentNumber
        });

        if (isRunning) {
          setTimeout(calculate, 0);
        }
      }

      onmessage = async function(e) {
        if (e.data === 'start') {
          if (!db) await initDB();
          const { lastPrime, totalCount } = await loadLastState();
          postMessage({
            type: 'init',
            current: currentNumber,
            totalCount: totalCount
          });

          isRunning = true;
          calculate();
        } else if (e.data === 'pause') {
          isRunning = false;
        } else if (e.data === 'reset') {
          isRunning = false;
          if (db) {
            db.close();
            db = null;
          }
          // IndexedDBのクリア
          const deleteReq = indexedDB.deleteDatabase("PrimeDatabase");
          deleteReq.onsuccess = () => {
            currentNumber = 2;
            postMessage({ type: 'reset_complete' });
          };
        }
      };
    `;

    // --- 2. メインスレッド側の処理 ---
    let worker = null;
    let workerUrl = null;
    let primeCount = 0;

    const MAX_DOM_LENGTH = 5000;

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const currentEl = document.getElementById('current');
    const countEl = document.getElementById('count');
    const resultDiv = document.getElementById('result');
    const fpsEl = document.getElementById('fps');
    const memoryEl = document.getElementById('memory');

    // --- FPS & メモリモニター機能 ---
    let frameCount = 0;
    let lastTime = performance.now();

    function updateMetrics() {
      const now = performance.now();
      frameCount++;

      if (now - lastTime >= 1000) {
        // FPSの更新
        fpsEl.textContent = frameCount;
        frameCount = 0;
        lastTime = now;

        // メモリ使用量の更新 (Chrome系ブラウザのみ対応)
        if (performance.memory) {
          const usedHeapMB = (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(1);
          memoryEl.textContent = usedHeapMB;
        } else {
          memoryEl.textContent = "非対応ブラウザ";
        }
      }
      requestAnimationFrame(updateMetrics);
    }
    requestAnimationFrame(updateMetrics);

    // Worker初期化
    function initWorker() {
      if (!worker) {
        const blob = new Blob([workerScript], { type: 'application/javascript' });
        workerUrl = URL.createObjectURL(blob);
        worker = new Worker(workerUrl);

        worker.onmessage = function(e) {
          const data = e.data;

          if (data.type === 'init') {
            primeCount = data.totalCount;
            countEl.textContent = primeCount.toLocaleString();
            currentEl.textContent = data.current.toLocaleString();
            return;
          }

          if (data.type === 'progress') {
            const { primes, current } = data;
            
            primeCount += primes.length;
            countEl.textContent = primeCount.toLocaleString();
            currentEl.textContent = current.toLocaleString();

            if (primes.length > 0) {
              const textToAdd = primes.join(', ') + ', ';
              resultDiv.appendChild(document.createTextNode(textToAdd));
              resultDiv.scrollTop = resultDiv.scrollHeight;

              if (resultDiv.textContent.length > MAX_DOM_LENGTH) {
                resultDiv.textContent = resultDiv.textContent.slice(-MAX_DOM_LENGTH);
              }
            }
          }

          if (data.type === 'reset_complete') {
            primeCount = 0;
            countEl.textContent = "0";
            currentEl.textContent = "2";
            resultDiv.textContent = "";
            statusEl.textContent = "データをリセットしました";
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resetBtn.disabled = false;
          }
        };
      }
    }

    // 開始ボタン
    startBtn.addEventListener('click', () => {
      initWorker();
      worker.postMessage('start');

      statusEl.textContent = "計算中...";
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      resetBtn.disabled = true; // 計算中はリセット不可にする
    });

    // 一時停止ボタン
    pauseBtn.addEventListener('click', () => {
      if (worker) {
        worker.postMessage('pause');
      }
      statusEl.textContent = "一時停止中";
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      resetBtn.disabled = false;
    });

    // リセットボタン
    resetBtn.addEventListener('click', () => {
      if (confirm("これまでに保存した素数データをすべて削除しますか？")) {
        initWorker();
        worker.postMessage('reset');
        statusEl.textContent = "リセット中...";
        startBtn.disabled = true;
        pauseBtn.disabled = true;
        resetBtn.disabled = true;
      }
    });
  </script>
</body>
</html>
