<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無限素数ジェネレーター (LocalDB & Web Worker)</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f4f4f9;
    }
    h1 { color: #333; }
    .controls { margin-bottom: 15px; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
    }
    .status-panel {
      background: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
    }
    #result {
      height: 300px;
      overflow-y: scroll;
      background: #1e1e1e;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 15px;
      border-radius: 5px;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1>無限素数ジェネレーター</h1>
  
  <div class="controls">
    <button id="startBtn">開始</button>
    <button id="stopBtn" disabled>停止</button>
  </div>

  <div class="status-panel">
    <p>現在探索中の数値: <strong><span id="current">2</span></strong></p>
    <p>発見した素数の総数: <strong><span id="count">0</span></strong></p>
  </div>

  <div id="result"></div>

  <script>
    // --- 1. Worker用のスクリプト文字列を定義 ---
    const workerScript = `
      let db = null;
      let currentNumber = 2;
      let isRunning = false;

      // DB接続をPromise化して初期化を確実に待つ
      function initDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("PrimeDatabase", 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("primes")) {
              db.createObjectStore("primes", { autoIncrement: true });
            }
          };
          request.onsuccess = (e) => {
            db = e.target.result;
            resolve(db);
          };
          request.onerror = (e) => reject(e);
        });
      }

      function isPrime(num) {
        if (num <= 1) return false;
        if (num === 2) return true;
        if (num % 2 === 0) return false;
        const sqrt = Math.sqrt(num);
        for (let i = 3; i <= sqrt; i += 2) {
          if (num % i === 0) return false;
        }
        return true;
      }

      function saveToDB(primes) {
        return new Promise((resolve) => {
          if (!db || primes.length === 0) {
            resolve();
            return;
          }
          const transaction = db.transaction(["primes"], "readwrite");
          const store = transaction.objectStore("primes");
          primes.forEach(prime => store.add(prime));
          
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => resolve(); // エラー時も処理を止めない
        });
      }

      async function calculate() {
        if (!isRunning) return;

        let foundPrimes = [];

        for (let i = 0; i < 1000; i++) {
          if (isPrime(currentNumber)) {
            foundPrimes.push(currentNumber);
          }
          currentNumber++;
        }

        // DB保存の完了を待ってから送信・次回呼び出し
        await saveToDB(foundPrimes);

        postMessage({
          primes: foundPrimes,
          current: currentNumber
        });

        if (isRunning) {
          setTimeout(calculate, 0);
        }
      }

      onmessage = async function(e) {
        if (e.data === 'start') {
          if (!db) await initDB();
          isRunning = true;
          calculate();
        } else if (e.data === 'stop') {
          isRunning = false;
        }
      };
    `;

    // --- 2. メインスレッド側の処理 ---
    let worker = null;
    let workerUrl = null;
    let primeCount = 0;

    const MAX_DOM_LENGTH = 5000;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const currentEl = document.getElementById('current');
    const countEl = document.getElementById('count');
    const resultDiv = document.getElementById('result');

    startBtn.addEventListener('click', () => {
      if (!worker) {
        const blob = new Blob([workerScript], { type: 'application/javascript' });
        workerUrl = URL.createObjectURL(blob);
        worker = new Worker(workerUrl);

        worker.onmessage = function(e) {
          const { primes, current } = e.data;
          
          primeCount += primes.length;
          countEl.textContent = primeCount.toLocaleString();
          currentEl.textContent = current.toLocaleString();

          if (primes.length > 0) {
            const textToAdd = primes.join(', ') + ', ';
            resultDiv.appendChild(document.createTextNode(textToAdd));
            resultDiv.scrollTop = resultDiv.scrollHeight;

            // 文字数が上限を超えた場合のみトリミング
            if (resultDiv.textContent.length > MAX_DOM_LENGTH) {
              resultDiv.textContent = resultDiv.textContent.slice(-MAX_DOM_LENGTH);
            }
          }
        };
      }

      worker.postMessage('start');
      startBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      if (worker) {
        // terminateの代わりにメッセージで停止フラグを立て、リソース解放
        worker.postMessage('stop');
        worker.terminate();
        worker = null;
      }
      if (workerUrl) {
        URL.revokeObjectURL(workerUrl); // メモリ解放
        workerUrl = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });
  </script>
</body>
</html>
