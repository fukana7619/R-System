<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>無限素数ジェネレーター</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #result { max-height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>無限素数計算アプリ</h1>
  <button id="startBtn">開始</button>
  <button id="stopBtn" disabled>停止</button>
  <p>見つかった素数の数: <span id="count">0</span></p>
  <div id="result"></div>

  <script>
    let isRunning = false;
    let currentNumber = 2;
    let primeCount = 0;
    let timeoutId = null;

    // 素数判定関数
    function isPrime(num) {
      for (let i = 2, s = Math.sqrt(num); i <= s; i++) {
        if (num % i === 0) return false;
      }
      return num > 1;
    }

    function calculateNext() {
      if (!isRunning) return;

      if (isPrime(currentNumber)) {
        primeCount++;
        document.getElementById('count').textContent = primeCount;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML += currentNumber + ', ';
        resultDiv.scrollTop = resultDiv.scrollHeight; // 自動スクロール
      }
      currentNumber++;

      // UIのフリーズを防ぐため、setTimeoutで非同期化
      timeoutId = setTimeout(calculateNext, 10);
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      isRunning = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      calculateNext();
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      isRunning = false;
      clearTimeout(timeoutId);
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    });
  </script>
</body>
</html>
