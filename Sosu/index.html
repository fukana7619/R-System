<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無限素数ジェネレーター (CPU & GPU Hybrid)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; text-align: center; }
    p.sub { color: #94a3b8; margin-top: 0; margin-bottom: 20px; text-align: center; }

    /* 免責事項 */
    .disclaimer {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #f87171;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* ベンチマークリンク */
    .nav-benchmarks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    .nav-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 15px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }
    .nav-card:hover { border-color: #38bdf8; }
    .nav-card.gpu:hover { border-color: #a855f7; }
    .nav-title { font-weight: bold; font-size: 14px; margin-bottom: 3px; }
    .nav-title.cpu { color: #38bdf8; }
    .nav-title.gpu { color: #c084fc; }
    .nav-desc { font-size: 11px; color: #94a3b8; }

    /* メインパネル */
    .main-panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }

    /* モード選択トグル */
    .engine-toggle {
      display: flex;
      justify-content: center;
      gap: 15px;
      background: #0f172a;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .engine-option {
      cursor: pointer;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.2s;
    }
    .engine-option input { display: none; }
    .engine-option.active-cpu { background: #0284c7; color: white; }
    .engine-option.active-gpu { background: #9333ea; color: white; }

    .controls { display: flex; gap: 10px; margin-bottom: 15px; }
    button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #334155;
      color: #f8fafc;
      transition: background-color 0.2s;
    }
    #startBtn { background-color: #38bdf8; color: #0f172a; }
    #startBtn:hover { background-color: #7dd3fc; }
    #resetBtn { background-color: #ef4444; color: white; }
    #resetBtn:hover { background-color: #f87171; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    .status-panel {
      background: #0f172a;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-bottom: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .status-panel p { margin: 5px 0; font-size: 13px; color: #94a3b8; }
    .status-panel span { color: #f8fafc; font-weight: bold; }

    #result {
      height: 200px;
      overflow-y: scroll;
      background: #090d16;
      color: #4ade80;
      font-family: monospace;
      padding: 15px;
      border-radius: 6px;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.5;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <h1>無限素数ジェネレーター</h1>
  <p class="sub">CPU (Web Worker) & GPU (WebGPU) ハイブリッド対応</p>

  <div class="disclaimer">
    ⚠️ <strong>【免責事項】</strong> 当社は一切の責任を負いません。PCを限界突破させて壊したい場合は自己責任でご利用ください！
  </div>

  <div class="nav-benchmarks">
    <a href="benchmark/CPU.html" class="nav-card">
      <div class="nav-title cpu">CPU ベンチマーク 専能画面 →</div>
      <div class="nav-desc">描画・DB完全なしでCPU単一コア限界測定</div>
    </a>
    <a href="benchmark/GPU.html" class="nav-card gpu">
      <div class="nav-title gpu">GPU ベンチマーク 専能画面 →</div>
      <div class="nav-desc">WebGPUによる数万並列処理の限界測定</div>
    </a>
  </div>

  <div class="main-panel">
    <div class="engine-toggle">
      <label class="engine-option active-cpu" id="labelCpu">
        <input type="radio" name="engine" value="cpu" checked> 💻 CPU モード (Worker)
      </label>
      <label class="engine-option" id="labelGpu">
        <input type="radio" name="engine" value="gpu"> ⚡ GPU モード (WebGPU)
      </label>
    </div>

    <div class="controls">
      <button id="startBtn">計算開始 / 再開</button>
      <button id="pauseBtn" disabled>一時停止</button>
      <button id="resetBtn">データリセット</button>
    </div>

    <div class="status-panel">
      <div>
        <p>ステータス: <span id="status">停止中</span></p>
        <p>現在探索中の数値: <span id="current">2</span></p>
        <p>発見した素数の総数: <span id="count">0</span></p>
      </div>
      <div>
        <p>リアルタイムスコア: <span id="score">0</span> pts</p>
        <p>処理速度: <span id="speed">0</span> 件/秒</p>
        <p>JSメモリ使用量: <span id="memory">--</span> MB</p>
      </div>
    </div>

    <div id="result"></div>
  </div>

  <script>
    // --- IndexedDB 共通処理 ---
    let db = null;
    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open("PrimeDatabaseHybrid", 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("primes")) d.createObjectStore("primes", { autoIncrement: true });
          if (!d.objectStoreNames.contains("state")) d.createObjectStore("state");
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      });
    }

    function loadState() {
      return new Promise((resolve) => {
        if (!db) return resolve({ current: 2, count: 0 });
        const tx = db.transaction(["primes", "state"], "readonly");
        const pStore = tx.objectStore("primes");
        const sStore = tx.objectStore("state");
        
        let count = 0, current = 2;
        const cReq = pStore.count();
        const sReq = sStore.get("currentNumber");

        tx.oncomplete = () => {
          count = cReq.result || 0;
          current = sReq.result || 2;
          resolve({ current, count });
        };
        tx.onerror = () => resolve({ current: 2, count: 0 });
      });
    }

    function saveStateAndPrimes(primes, lastNum) {
      if (!db) return;
      const tx = db.transaction(["primes", "state"], "readwrite");
      if (primes.length > 0) {
        const pStore = tx.objectStore("primes");
        primes.forEach(p => pStore.add(p));
      }
      tx.objectStore("state").put(lastNum, "currentNumber");
    }

    // --- 変数定義 ---
    let isRunning = false;
    let selectedEngine = 'cpu';
    let currentNumber = 2;
    let totalPrimeCount = 0;

    let checkedInSec = 0;
    let opsInSec = 0;

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const currentEl = document.getElementById('current');
    const countEl = document.getElementById('count');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const memoryEl = document.getElementById('memory');
    const resultDiv = document.getElementById('result');

    // トグル切替イベント
    const labelCpu = document.getElementById('labelCpu');
    const labelGpu = document.getElementById('labelGpu');
    document.querySelectorAll('input[name="engine"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        selectedEngine = e.target.value;
        if (selectedEngine === 'cpu') {
          labelCpu.className = 'engine-option active-cpu';
          labelGpu.className = 'engine-option';
        } else {
          labelGpu.className = 'engine-option active-gpu';
          labelCpu.className = 'engine-option';
        }
      });
    });

    // --- モニタータイマー (1秒ごと) ---
    setInterval(() => {
      if (performance.memory) {
        memoryEl.textContent = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
      }
      speedEl.textContent = checkedInSec.toLocaleString();

      if (opsInSec > 0) {
        const divisor = (selectedEngine === 'cpu') ? 10000 : 100000;
        scoreEl.textContent = Math.round(opsInSec / divisor).toLocaleString();
      } else {
        scoreEl.textContent = "0";
      }

      checkedInSec = 0;
      opsInSec = 0;
    }, 1000);

    // --- CPU モード (Worker) 実装 ---
    let worker = null;
    const workerScript = `
      function checkPrime(num) {
        if (num <= 1) return { isPrime: false, ops: 1 };
        if (num === 2) return { isPrime: true, ops: 1 };
        if (num % 2 === 0) return { isPrime: false, ops: 1 };
        let ops = 2;
        const sqrt = Math.sqrt(num);
        for (let i = 3; i <= sqrt; i += 2) {
          ops++;
          if (num % i === 0) return { isPrime: false, ops };
        }
        return { isPrime: true, ops };
      }

      let isRunning = false;
      let currentNumber = 2;

      onmessage = function(e) {
        if (e.data.cmd === 'start') {
          isRunning = true;
          currentNumber = e.data.startNum;
          loop();
        } else if (e.data.cmd === 'stop') {
          isRunning = false;
        }
      };

      function loop() {
        if (!isRunning) return;
        let found = [];
        let totalOps = 0;
        const BATCH = 1000;

        for (let i = 0; i < BATCH; i++) {
          const res = checkPrime(currentNumber);
          totalOps += res.ops;
          if (res.isPrime) found.push(currentNumber);
          currentNumber++;
        }

        postMessage({ primes: found, current: currentNumber, ops: totalOps, checked: BATCH });
        if (isRunning) setTimeout(loop, 0);
      }
    `;

    function runCpuMode() {
      if (!worker) {
        const blob = new Blob([workerScript], { type: 'application/javascript' });
        worker = new Worker(URL.createObjectURL(blob));
        worker.onmessage = (e) => {
          if (!isRunning) return;
          const { primes, current, ops, checked } = e.data;
          checkedInSec += checked;
          opsInSec += ops;
          currentNumber = current;
          totalPrimeCount += primes.length;

          currentEl.textContent = currentNumber.toLocaleString();
          countEl.textContent = totalPrimeCount.toLocaleString();

          saveStateAndPrimes(primes, currentNumber);
          appendPrimesToDom(primes);
        };
      }
      worker.postMessage({ cmd: 'start', startNum: currentNumber });
    }

    // --- GPU モード (WebGPU) 実装 ---
    let gpuDevice = null, gpuPipeline = null;
    const wgslCode = `
      struct Uniforms { startNum : u32 };
      @group(0) @binding(0) var<uniform> uniforms : Uniforms;
      @group(0) @binding(1) var<storage, read_write> opsBuffer : array<u32>;

      @compute @workgroup_size(256)
      fn main(@builtin(global_invocation_id) global_id : vec3<u32>) {
        let index = global_id.x;
        let num = uniforms.startNum + index;
        var ops : u32 = 1u;
        if (num > 2u && num % 2u != 0u) {
          ops = 2u;
          let limit = u32(sqrt(f32(num)));
          for (var i : u32 = 3u; i <= limit; i += 2u) {
            ops += 1u;
            if (num % i == 0u) { break; }
          }
        }
        opsBuffer[index] = ops;
      }
    `;

    async function initGPU() {
      if (!navigator.gpu) { alert("WebGPU非対応ブラウザです"); return false; }
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) return false;
      gpuDevice = await adapter.requestDevice();
      const module = gpuDevice.createShaderModule({ code: wgslCode });
      gpuPipeline = gpuDevice.createComputePipeline({
        layout: 'auto',
        compute: { module, entryPoint: 'main' }
      });
      return true;
    }

    async function runGpuMode() {
      if (!gpuDevice) {
        const ok = await initGPU();
        if (!ok) { stopCalculation(); return; }
      }

      const TOTAL_THREADS = 65536;
      const uniformBuffer = gpuDevice.createBuffer({ size: 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      const opsBuffer = gpuDevice.createBuffer({ size: TOTAL_THREADS * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
      const readBuffer = gpuDevice.createBuffer({ size: TOTAL_THREADS * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });

      while (isRunning) {
        gpuDevice.queue.writeBuffer(uniformBuffer, 0, new Uint32Array([currentNumber]));
        const bindGroup = gpuDevice.createBindGroup({
          layout: gpuPipeline.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: { buffer: uniformBuffer } },
            { binding: 1, resource: { buffer: opsBuffer } }
          ]
        });

        const encoder = gpuDevice.createCommandEncoder();
        const pass = encoder.beginComputePass();
        pass.setPipeline(gpuPipeline);
        pass.setBindGroup(0, bindGroup);
        pass.dispatchWorkgroups(256);
        pass.end();

        encoder.copyBufferToBuffer(opsBuffer, 0, readBuffer, 0, TOTAL_THREADS * 4);
        gpuDevice.queue.submit([encoder.finish()]);

        await readBuffer.mapAsync(GPUMapMode.READ);
        const res = new Uint32Array(readBuffer.getMappedRange());
        let batchOps = 0;
        for (let i = 0; i < TOTAL_THREADS; i++) batchOps += res[i];
        readBuffer.unmap();

        checkedInSec += TOTAL_THREADS;
        opsInSec += batchOps;
        currentNumber += TOTAL_THREADS;

        currentEl.textContent = currentNumber.toLocaleString();
        saveStateAndPrimes([], currentNumber); // GPU爆速モードはステータスのみ保存
      }
    }

    // --- DOM描画補助 ---
    const MAX_DOM = 3000;
    function appendPrimesToDom(primes) {
      if (primes.length === 0) return;
      const txt = primes.join(', ') + ', ';
      resultDiv.appendChild(document.createTextNode(txt));
      resultDiv.scrollTop = resultDiv.scrollHeight;
      if (resultDiv.textContent.length > MAX_DOM) {
        let trimmed = resultDiv.textContent.slice(-MAX_DOM);
        const idx = trimmed.indexOf(',');
        if (idx !== -1) trimmed = trimmed.slice(idx + 2);
        resultDiv.textContent = trimmed;
      }
    }

    // --- 制御ロジック ---
    startBtn.addEventListener('click', async () => {
      await initDB();
      const state = await loadState();
      if (!isRunning) {
        currentNumber = state.current;
        totalPrimeCount = state.count;
        countEl.textContent = totalPrimeCount.toLocaleString();
      }

      isRunning = true;
      statusEl.textContent = selectedEngine.toUpperCase() + " で計算中...";
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      resetBtn.disabled = true;

      document.querySelectorAll('input[name="engine"]').forEach(r => r.disabled = true);

      if (selectedEngine === 'cpu') runCpuMode();
      else runGpuMode();
    });

    function stopCalculation() {
      isRunning = false;
      if (worker) worker.postMessage({ cmd: 'stop' });
      statusEl.textContent = "一時停止中";
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      resetBtn.disabled = false;
      document.querySelectorAll('input[name="engine"]').forEach(r => r.disabled = false);
    }

    pauseBtn.addEventListener('click', stopCalculation);

    resetBtn.addEventListener('click', async () => {
      if (confirm("全データを削除して初期化しますか？")) {
        stopCalculation();
        if (worker) { worker.terminate(); worker = null; }
        if (db) { db.close(); db = null; }
        await indexedDB.deleteDatabase("PrimeDatabaseHybrid");
        currentNumber = 2;
        totalPrimeCount = 0;
        currentEl.textContent = "2";
        countEl.textContent = "0";
        scoreEl.textContent = "0";
        speedEl.textContent = "0";
        resultDiv.textContent = "";
        statusEl.textContent = "リセット完了";
      }
    });
  </script>
</body>
</html>
