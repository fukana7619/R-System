<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無限素数ジェネレーター (LocalDB & Web Worker)</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f4f4f9;
    }
    h1 { color: #333; }
    .controls { margin-bottom: 15px; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
    }
    #resetBtn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #resetBtn:hover { background-color: #cc0000; }
    #resetBtn:disabled { background-color: #ccc; }
    
    .status-panel {
      background: #fff;
      padding: 15px;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .status-panel p { margin: 5px 0; }
    
    #result {
      height: 300px;
      overflow-y: scroll;
      background: #1e1e1e;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 15px;
      border-radius: 5px;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1>無限素数ジェネレーター</h1>
  
  <div class="controls">
    <button id="startBtn">開始 / 再開</button>
    <button id="pauseBtn" disabled>一時停止</button>
    <button id="resetBtn">データリセット</button>
  </div>

  <div class="status-panel">
    <div>
      <p>ステータス: <strong><span id="status">停止中</span></strong></p>
      <p>現在探索中の数値: <strong><span id="current">2</span></strong></p>
      <p>発見した素数の総数: <strong><span id="count">0</span></strong></p>
    </div>
    <div>
      <p>CPUスコア: <strong><span id="score">0</span> pts</strong></p>
      <p>処理速度: <strong><span id="speed">0</span> 件/秒</strong></p>
      <p>JSメモリ: <strong><span id="memory">--</span> MB</strong></p>
    </div>
  </div>

  <div id="result"></div>

  <script>
    // --- 1. Worker用のスクリプト文字列を定義 ---
    const workerScript = `
      let db = null;
      let currentNumber = 2;
      let isRunning = false;

      function initDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("PrimeDatabase", 2);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("primes")) {
              db.createObjectStore("primes", { autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("state")) {
              db.createObjectStore("state");
            }
          };
          request.onsuccess = (e) => {
            db = e.target.result;
            resolve(db);
          };
          request.onerror = (e) => reject(e);
        });
      }

      function loadLastState() {
        return new Promise((resolve) => {
          if (!db) return resolve({ current: 2, totalCount: 0 });
          const transaction = db.transaction(["primes", "state"], "readonly");
          const primeStore = transaction.objectStore("primes");
          const stateStore = transaction.objectStore("state");
          
          let totalCount = 0;
          let savedCurrent = 2;

          const countReq = primeStore.count();
          const stateReq = stateStore.get("currentNumber");

          transaction.oncomplete = () => {
            totalCount = countReq.result || 0;
            savedCurrent = stateReq.result || 2;
            currentNumber = savedCurrent;
            resolve({ current: currentNumber, totalCount });
          };

          transaction.onerror = () => resolve({ current: 2, totalCount: 0 });
        });
      }

      // 素数判定 ＆ 実行した演算（割り算）回数をカウント
      function checkPrimeWithOps(num) {
        if (num <= 1) return { isPrime: false, ops: 1 };
        if (num === 2) return { isPrime: true, ops: 1 };
        if (num % 2 === 0) return { isPrime: false, ops: 1 };
        
        let ops = 2;
        const sqrt = Math.sqrt(num);
        for (let i = 3; i <= sqrt; i += 2) {
          ops++;
          if (num % i === 0) return { isPrime: false, ops };
        }
        return { isPrime: true, ops };
      }

      function saveToDB(primes, lastChecked) {
        return new Promise((resolve) => {
          if (!db) return resolve();
          const transaction = db.transaction(["primes", "state"], "readwrite");
          const primeStore = transaction.objectStore("primes");
          const stateStore = transaction.objectStore("state");

          primes.forEach(prime => primeStore.add(prime));
          stateStore.put(lastChecked, "currentNumber");
          
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => resolve();
        });
      }

      async function calculate() {
        if (!isRunning) return;

        let foundPrimes = [];
        let totalOps = 0;
        const BATCH_SIZE = 1000;

        for (let i = 0; i < BATCH_SIZE; i++) {
          const res = checkPrimeWithOps(currentNumber);
          totalOps += res.ops;
          if (res.isPrime) {
            foundPrimes.push(currentNumber);
          }
          currentNumber++;
        }

        await saveToDB(foundPrimes, currentNumber);

        postMessage({
          type: 'progress',
          primes: foundPrimes,
          current: currentNumber,
          checkedCount: BATCH_SIZE,
          opsCount: totalOps
        });

        if (isRunning) {
          setTimeout(calculate, 0);
        }
      }

      onmessage = async function(e) {
        if (e.data === 'start') {
          if (!db) await initDB();
          const { current, totalCount } = await loadLastState();
          postMessage({
            type: 'init',
            current: current,
            totalCount: totalCount
          });

          isRunning = true;
          calculate();
        } else if (e.data === 'pause') {
          isRunning = false;
        }
      };
    `;

    // --- 2. メインスレッド側の処理 ---
    let worker = null;
    let workerUrl = null;
    let primeCount = 0;

    let checkedCountInSec = 0;
    let totalOpsInSec = 0;

    const MAX_DOM_LENGTH = 5000;

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const currentEl = document.getElementById('current');
    const countEl = document.getElementById('count');
    const resultDiv = document.getElementById('result');
    const speedEl = document.getElementById('speed');
    const scoreEl = document.getElementById('score');
    const memoryEl = document.getElementById('memory');

    // --- モニター＆スコア計算ルーチン (1秒毎) ---
    setInterval(() => {
      // メモリ表示 (Chrome系対応)
      if (performance.memory) {
        const usedHeapMB = (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(1);
        memoryEl.textContent = usedHeapMB;
      } else {
        memoryEl.textContent = "非対応";
      }

      // 処理速度（件/秒）更新
      speedEl.textContent = checkedCountInSec.toLocaleString();

      // CPUスコア計算： 1秒間に実行した累積計算回数 ÷ 10,000
      if (totalOpsInSec > 0) {
        const realScore = Math.round(totalOpsInSec / 10000);
        scoreEl.textContent = realScore.toLocaleString();
      } else {
        scoreEl.textContent = "0";
      }

      // 1秒ごとに集計変数をリセット
      checkedCountInSec = 0;
      totalOpsInSec = 0;
    }, 1000);

    function initWorker() {
      if (!worker) {
        const blob = new Blob([workerScript], { type: 'application/javascript' });
        workerUrl = URL.createObjectURL(blob);
        worker = new Worker(workerUrl);

        worker.onmessage = function(e) {
          const data = e.data;

          if (data.type === 'init') {
            primeCount = data.totalCount;
            countEl.textContent = primeCount.toLocaleString();
            currentEl.textContent = data.current.toLocaleString();
            return;
          }

          if (data.type === 'progress') {
            const { primes, current, checkedCount, opsCount } = data;
            
            checkedCountInSec += checkedCount;
            totalOpsInSec += opsCount;

            primeCount += primes.length;
            countEl.textContent = primeCount.toLocaleString();
            currentEl.textContent = current.toLocaleString();

            if (primes.length > 0) {
              const textToAdd = primes.join(', ') + ', ';
              resultDiv.appendChild(document.createTextNode(textToAdd));
              resultDiv.scrollTop = resultDiv.scrollHeight;

              // DOMのトリミング処理
              if (resultDiv.textContent.length > MAX_DOM_LENGTH) {
                let trimmed = resultDiv.textContent.slice(-MAX_DOM_LENGTH);
                const firstComma = trimmed.indexOf(',');
                if (firstComma !== -1) trimmed = trimmed.slice(firstComma + 2);
                resultDiv.textContent = trimmed;
              }
            }
          }
        };
      }
    }

    startBtn.addEventListener('click', () => {
      initWorker();
      worker.postMessage('start');

      statusEl.textContent = "計算中...";
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      resetBtn.disabled = true;
    });

    pauseBtn.addEventListener('click', () => {
      if (worker) {
        worker.postMessage('pause');
      }
      statusEl.textContent = "一時停止中";
      speedEl.textContent = "0";
      scoreEl.textContent = "0";
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      resetBtn.disabled = false;
    });

    resetBtn.addEventListener('click', () => {
      if (confirm("これまでに保存した素数データをすべて削除しますか？")) {
        statusEl.textContent = "リセット中...";
        startBtn.disabled = true;
        pauseBtn.disabled = true;
        resetBtn.disabled = true;

        if (worker) {
          worker.terminate();
          worker = null;
        }
        if (workerUrl) {
          URL.revokeObjectURL(workerUrl);
          workerUrl = null;
        }

        const deleteReq = indexedDB.deleteDatabase("PrimeDatabase");
        deleteReq.onsuccess = () => {
          primeCount = 0;
          checkedCountInSec = 0;
          totalOpsInSec = 0;
          speedEl.textContent = "0";
          scoreEl.textContent = "0";
          countEl.textContent = "0";
          currentEl.textContent = "2";
          resultDiv.textContent = "";
          statusEl.textContent = "データをリセットしました";
          startBtn.disabled = false;
          resetBtn.disabled = false;
        };
        deleteReq.onerror = () => {
          alert("DBの削除に失敗しました。ページを再読み込みしてください。");
        };
      }
    });
  </script>
</body>
</html>
