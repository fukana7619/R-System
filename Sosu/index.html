<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極限・素数ベンチマーク</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-cpu: #38bdf8;
      --accent-gpu: #a855f7;
      --border-color: #334155;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px 0;
      font-size: 24px;
      letter-spacing: 1px;
    }

    /* エンジン切替トグル */
    .engine-toggle {
      display: flex;
      background: #090d16;
      border-radius: 12px;
      padding: 6px;
      border: 1px solid var(--border-color);
      gap: 6px;
    }

    .engine-option {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
      user-select: none;
    }

    .engine-option input { display: none; }

    .engine-option.active-cpu {
      background: var(--accent-cpu);
      color: #000;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .engine-option.active-gpu {
      background: var(--accent-gpu);
      color: #fff;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    /* ダッシュボード */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .card .label { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    .card .value { font-size: 22px; font-weight: bold; font-family: monospace; }

    /* コントロールパネル */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s, opacity 0.2s;
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #22c55e; color: #000; }
    #pauseBtn { background: #eab308; color: #000; }
    #saveBtn { background: #0284c7; color: #fff; }
    #downloadBtn { background: #3b82f6; color: #fff; }
    #connectDbBtn { background: #64748b; color: #fff; }
    #resetBtn { background: #ef4444; color: #fff; }

    /* 詳細設定アコーディオン */
    details {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 15px;
    }

    summary {
      font-weight: bold;
      cursor: pointer;
      padding: 5px 0;
      color: #cbd5e1;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .setting-item label { font-size: 12px; color: #94a3b8; }
    .setting-item input, .setting-item select {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
    }

    /* 描画エリア */
    .result-box {
      background: #050811;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: #4ade80;
      word-break: break-all;
    }

    /* ステータスバー */
    .status-bar {
      font-size: 13px;
      color: #38bdf8;
      background: #090d16;
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>⚡ リアルタイム素数ベンチマーク ⚡</h1>

  <div class="engine-toggle">
    <label class="engine-option active-cpu" id="labelCpu">
      <input type="radio" name="engine" value="cpu" checked> 💻 CPU (Web Worker)
    </label>
    <label class="engine-option" id="labelGpu">
      <input type="radio" name="engine" value="gpu"> ⚡ GPU (WebGPU)
    </label>
  </div>

  <div class="status-bar">
    <div>ステータス: <span id="status" style="font-weight: bold; color: #fff;">待機中</span></div>
    <div style="font-size: 11px; color: #94a3b8;">💾 最終保存日時: <span id="lastSaveText" style="color: #cbd5e1;">未保存</span></div>
  </div>

  <div class="dashboard">
    <div class="card">
      <div class="label">現在の探索値</div>
      <div class="value" id="current">2</div>
    </div>
    <div class="card">
      <div class="label">発見した素数</div>
      <div class="value" id="count">0</div>
    </div>
    <div class="card">
      <div class="label">処理速度 (数/秒)</div>
      <div class="value" id="speed">0</div>
    </div>
    <div class="card">
      <div class="label">ベンチマークスコア</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="card">
      <div class="label">JSメモリ使用量 (MB)</div>
      <div class="value" id="memory">0.0</div>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn">▶ 計算開始</button>
    <button id="pauseBtn" disabled>⏸ 一時停止</button>
    <button id="saveBtn">💾 今すぐ手動保存</button>
    <button id="downloadBtn">📥 JSON出力</button>
    <button id="connectDbBtn">🔌 DB再接続</button>
    <button id="resetBtn">🔄 初期化</button>
  </div>

  <details>
    <summary>⚙️ パラメータ詳細設定</summary>
    <div class="settings-grid">
      <div class="setting-item">
        <label for="savePolicy">💾 DB保存ポリシー:</label>
        <select id="savePolicy">
          <option value="stateOnly" selected>状態(到達点)のみ保存 (超高速・推奨)</option>
          <option value="all">素数を全件DB保存 (低速・大容量)</option>
          <option value="none">DB保存なし (メモリのみ)</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="gpuThreads">⚡ GPU並列スレッド数 (WebGPU):</label>
        <input type="number" id="gpuThreads" value="65536" step="256" min="256">
        <div style="font-size: 11px; color: #38bdf8; margin-top: 4px; line-height: 1.4;">
          💻 この端末の理論上限: <span id="gpuLimitText">取得中...</span><br>
          💡 <strong>推奨設定:</strong> <code>65,536</code> (安定) / <code>262,144</code> (高負荷)
        </div>
        <div id="threadWarning" style="display: none; font-size: 11px; color: #fbbf24; background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; padding: 6px 8px; border-radius: 4px; margin-top: 6px;">
          ⚠️ <strong>警告:</strong> 理論上限値を超えています！画面フリーズやGPU強制リセット注意。
        </div>
      </div>
      <div class="setting-item">
        <label for="cpuBatch">💻 CPUバッチサイズ (個/ループ):</label>
        <input type="number" id="cpuBatch" value="1000" step="100" min="100">
      </div>
      <div class="setting-item">
        <label for="domLimit">🖥️ 画面描画保持文字数 (0でオフ):</label>
        <input type="number" id="domLimit" value="3000" step="500" min="0">
      </div>
    </div>
  </details>

  <div class="result-box" id="result"></div>
</div>

<script src="app.js"></script>
</body>
</html>
