<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>R-System Account</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #121212; /* 深い黒背景 */
      color: #e0e0e0;           /* 少し落とした白色テキスト */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e1e1e;       /* カードは少し明るめの黒/ダークグレー */
      padding: 40px;
      border-radius: 12px;
      border: 1px solid #2c2c2c; /* 薄いボーダーで引き締める */
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 400px;
      width: 85%;
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 0.9rem;
      color: #a0a0a0;            /* 補足文は少しグレーに落とす */
      margin: 0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>R-System Accountは準備中です</h1>
    <p>各アプリからアクセスしてください。</p>
  </div>
</body>
</html>
