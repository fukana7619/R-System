<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>時計</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100;300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: "Roboto Mono", "Courier New", monospace;
        font-weight: 100;
        overflow: hidden;
        user-select: none;
        cursor: none;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #date-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: clamp(6px, 1.5vh, 20px);
      }
      #date-wrap.hidden-el {
        display: none;
      }

      #time-wrap {
        display: flex;
        align-items: baseline;
        justify-content: center;
      }
      #time-wrap.hidden-el {
        display: none;
      }

      #date {
        font-size: clamp(1.4rem, 4.5vw, 3rem);
        font-weight: 300;
        letter-spacing: 0.12em;
        color: #fff;
        font-variant-numeric: tabular-nums;
      }

      .seg {
        font-size: clamp(3.5rem, 18vw, 14rem);
        font-weight: 100;
        letter-spacing: 0;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .colon {
        font-size: clamp(3.5rem, 18vw, 14rem);
        font-weight: 100;
        line-height: 1;
        padding: 0 0.05em;
      }

      #sec-group {
        display: contents;
      }
      #hhmm-group {
        display: contents;
      }
      #sec-group.hidden-el {
        display: none;
      }
      #hhmm-group.hidden-el {
        display: none;
      }

      /* ======= 歯車ボタン ======= */
      #gear-btn {
        position: fixed;
        bottom: 28px;
        right: 28px;
        width: 44px;
        height: 44px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.3s,
          background 0.2s;
        z-index: 100;
      }
      #gear-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      #gear-btn svg {
        width: 20px;
        height: 20px;
        fill: #fff;
      }
      #gear-btn.visible {
        opacity: 1;
        cursor: pointer;
      }

      /* ======= 設定パネル ======= */
      #panel {
        position: fixed;
        bottom: 84px;
        right: 28px;
        width: 290px;
        background: rgba(20, 20, 20, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 20px 22px;
        font-family: "Roboto Mono", monospace;
        font-weight: 300;
        font-size: 0.78rem;
        color: #ccc;
        z-index: 200;
        display: none;
        flex-direction: column;
        gap: 18px;
        cursor: default;
      }
      #panel.open {
        display: flex;
      }

      .p-section-title {
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.35);
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .toggle-label {
        color: #ddd;
      }
      .toggle {
        position: relative;
        width: 36px;
        height: 20px;
        flex-shrink: 0;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-track {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .toggle input:checked + .toggle-track {
        background: #fff;
      }
      .toggle-track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        background: #000;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .toggle input:checked + .toggle-track::after {
        transform: translateX(16px);
      }

      .radio-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .radio-row {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        color: #ddd;
      }
      .radio-row input[type="radio"] {
        accent-color: #fff;
        width: 14px;
        height: 14px;
        cursor: pointer;
      }

      /* NTPステータス */
      #ntp-status {
        font-size: 0.65rem;
        margin-top: 6px;
        min-height: 1em;
        padding-left: 2px;
        transition: color 0.3s;
      }
      #ntp-status.ok {
        color: rgba(120, 220, 120, 0.8);
      }
      #ntp-status.error {
        color: rgba(220, 100, 100, 0.8);
      }
      #ntp-status.loading {
        color: rgba(200, 200, 200, 0.4);
      }

      .slider-block {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .slider-header {
        display: flex;
        justify-content: space-between;
        color: #ddd;
        font-size: 0.75rem;
      }
      .slider-val {
        color: rgba(255, 255, 255, 0.5);
      }
      .slider-labels {
        display: flex;
        justify-content: space-between;
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.65rem;
      }
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .divider {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="date-wrap">
      <span id="date">----/--/--</span>
    </div>

    <div id="time-wrap">
      <span id="hhmm-group">
        <span class="seg" id="hh">--</span>
        <span class="colon" id="colon1">:</span>
        <span class="seg" id="mm">--</span>
      </span>
      <span id="sec-group">
        <span class="colon" id="colon2">:</span>
        <span class="seg" id="sec">--</span>
      </span>
    </div>

    <button id="gear-btn" aria-label="設定">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.69.07-1.08s-.03-.74-.07-1.08l2.34-1.83c.21-.16.27-.46.13-.7l-2.22-3.84c-.14-.24-.43-.32-.67-.24l-2.76 1.11c-.58-.44-1.2-.82-1.88-1.1L14 2.42c-.05-.27-.29-.42-.56-.42h-4.44c-.27 0-.5.15-.55.42l-.42 2.94c-.68.28-1.3.66-1.88 1.1L3.39 5.35c-.24-.08-.53 0-.67.24L.5 9.43c-.14.24-.08.54.13.7l2.34 1.83C2.93 12.26 2.9 12.61 2.9 13s.03.74.07 1.08L.63 15.91c-.21.16-.27.46-.13.7l2.22 3.84c.14.24.43.32.67.24l2.76-1.11c.58.44 1.2.82 1.88 1.1l.42 2.94c.05.27.28.42.55.42h4.44c.27 0 .51-.15.56-.42l.42-2.94c.68-.28 1.3-.66 1.88-1.1l2.76 1.11c.24.08.53 0 .67-.24l2.22-3.84c.14-.24.08-.54-.13-.7l-2.34-1.83z"
        />
      </svg>
    </button>

    <div id="panel">
      <div>
        <div class="p-section-title">時刻ソース</div>
        <div class="radio-group">
          <label class="radio-row"
            ><input type="radio" name="src" value="device" checked />
            端末の時計</label
          >
          <label class="radio-row"
            ><input type="radio" name="src" value="ntp" /> インターネット
            (NTP)</label
          >
        </div>
        <div id="ntp-status"></div>
      </div>

      <hr class="divider" />

      <div>
        <div class="p-section-title">表示項目</div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div class="toggle-row">
            <span class="toggle-label">日付</span>
            <label class="toggle"
              ><input type="checkbox" id="tog-date" checked /><span
                class="toggle-track"
              ></span
            ></label>
          </div>
          <div class="toggle-row">
            <span class="toggle-label">時・分</span>
            <label class="toggle"
              ><input type="checkbox" id="tog-hhmm" checked /><span
                class="toggle-track"
              ></span
            ></label>
          </div>
          <div class="toggle-row">
            <span class="toggle-label">秒</span>
            <label class="toggle"
              ><input type="checkbox" id="tog-sec" checked /><span
                class="toggle-track"
              ></span
            ></label>
          </div>
        </div>
      </div>

      <hr class="divider" />

      <div>
        <div class="p-section-title">サイズ</div>
        <div style="display: flex; flex-direction: column; gap: 14px">
          <div class="slider-block">
            <div class="slider-header">
              <span>日付</span
              ><span class="slider-val" id="date-size-val">100%</span>
            </div>
            <input
              type="range"
              id="date-size"
              min="40"
              max="200"
              value="100"
              step="5"
            />
            <div class="slider-labels"><span>小</span><span>大</span></div>
          </div>
          <div class="slider-block">
            <div class="slider-header">
              <span>時刻</span
              ><span class="slider-val" id="time-size-val">100%</span>
            </div>
            <input
              type="range"
              id="time-size"
              min="40"
              max="200"
              value="100"
              step="5"
            />
            <div class="slider-labels"><span>小</span><span>大</span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* =============================================
   IndexedDB ヘルパー
   ============================================= */
      const DB_NAME = "clock-settings";
      const DB_VERSION = 1;
      const STORE = "prefs";

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            e.target.result.createObjectStore(STORE);
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async function dbGet(key) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const req = tx.objectStore(STORE).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function dbSet(key, value) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          const req = tx.objectStore(STORE).put(value, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      /* =============================================
   アプリ状態
   ============================================= */
      const state = {
        src: "device",
        ntpOffset: 0,
        showDate: true,
        showHHMM: true,
        showSec: true,
        dateSize: 100,
        timeSize: 100,
      };

      /* =============================================
   設定の保存・読み込み
   ============================================= */
      const SAVE_KEYS = [
        "src",
        "showDate",
        "showHHMM",
        "showSec",
        "dateSize",
        "timeSize",
      ];

      async function saveSettings() {
        try {
          const data = {};
          SAVE_KEYS.forEach((k) => (data[k] = state[k]));
          await dbSet("settings", data);
        } catch (e) {
          console.warn("設定保存失敗", e);
        }
      }

      async function loadSettings() {
        try {
          const data = await dbGet("settings");
          if (!data) return;
          SAVE_KEYS.forEach((k) => {
            if (data[k] !== undefined) state[k] = data[k];
          });
        } catch (e) {
          console.warn("設定読み込み失敗", e);
        }
      }

      /* =============================================
   DOM 要素
   ============================================= */
      const elDateWrap = document.getElementById("date-wrap");
      const elDate = document.getElementById("date");
      const elTimeWrap = document.getElementById("time-wrap");
      const elHHMMGroup = document.getElementById("hhmm-group");
      const elSecGroup = document.getElementById("sec-group");
      const elHH = document.getElementById("hh");
      const elMM = document.getElementById("mm");
      const elSec = document.getElementById("sec");
      const elColon2 = document.getElementById("colon2");
      const gearBtn = document.getElementById("gear-btn");
      const panel = document.getElementById("panel");
      const ntpStatus = document.getElementById("ntp-status");

      /* =============================================
   tick
   ============================================= */
      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function tick() {
        const base =
          state.src === "ntp"
            ? new Date(Date.now() + state.ntpOffset)
            : new Date();
        elDate.textContent = `${base.getFullYear()}-${pad(base.getMonth() + 1)}-${pad(base.getDate())}`;
        elHH.textContent = pad(base.getHours());
        elMM.textContent = pad(base.getMinutes());
        elSec.textContent = pad(base.getSeconds());
      }

      /* =============================================
   NTP 取得
   - フォールバックで端末時計には戻さない
   - 複数エンドポイントを順番に試みる
   ============================================= */
      const NTP_ENDPOINTS = [
        async () => {
          const r = await fetch(
            "https://timeapi.io/api/time/current/zone?timeZone=UTC",
            { signal: AbortSignal.timeout(5000) },
          );
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const j = await r.json();
          // dateTime: "2026-09-16T01:23:45.678"
          return new Date(j.dateTime + "Z").getTime();
        },
        async () => {
          const r = await fetch("https://worldtimeapi.org/api/timezone/UTC", {
            signal: AbortSignal.timeout(5000),
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const j = await r.json();
          return new Date(j.datetime).getTime();
        },
      ];

      async function fetchNTP() {
        ntpStatus.textContent = "取得中…";
        ntpStatus.className = "loading";

        for (const endpoint of NTP_ENDPOINTS) {
          try {
            const before = Date.now();
            const serverMs = await endpoint();
            const after = Date.now();
            // ラウンドトリップの半分をレイテンシ補正
            const latency = Math.round((after - before) / 2);
            state.ntpOffset = serverMs - before + latency;
            ntpStatus.textContent = `同期済み (±${latency}ms)`;
            ntpStatus.className = "ok";
            return; // 成功したら終了
          } catch (e) {
            console.warn("NTPエンドポイント失敗:", e);
          }
        }

        // 全エンドポイント失敗 → オフセット0のまま継続（端末時計に戻さない）
        ntpStatus.textContent = "取得失敗 (端末時計で代替中)";
        ntpStatus.className = "error";
      }

      /* =============================================
   表示更新
   ============================================= */
      function applyDisplay() {
        elDateWrap.classList.toggle("hidden-el", !state.showDate);

        const anyTime = state.showHHMM || state.showSec;
        elTimeWrap.classList.toggle("hidden-el", !anyTime);

        elHHMMGroup.classList.toggle("hidden-el", !state.showHHMM);

        if (state.showSec && !state.showHHMM) {
          // 時分OFF・秒ONのみ → コロンなし秒だけ
          elSecGroup.classList.remove("hidden-el");
          elColon2.style.display = "none";
        } else {
          elSecGroup.classList.toggle("hidden-el", !state.showSec);
          elColon2.style.display = "";
        }
      }

      function applyDateSize() {
        const s = state.dateSize / 100;
        elDate.style.fontSize = `clamp(${1.4 * s}rem, ${4.5 * s}vw, ${3 * s}rem)`;
      }

      function applyTimeSize() {
        const s = state.timeSize / 100;
        const fs = `clamp(${3.5 * s}rem, ${18 * s}vw, ${14 * s}rem)`;
        document
          .querySelectorAll(".seg, .colon")
          .forEach((el) => (el.style.fontSize = fs));
      }

      function applyAll() {
        applyDisplay();
        applyDateSize();
        applyTimeSize();
      }

      /* =============================================
   UI とステートの同期
   ============================================= */
      function syncUIFromState() {
        document.querySelector(`input[name=src][value=${state.src}]`).checked =
          true;
        document.getElementById("tog-date").checked = state.showDate;
        document.getElementById("tog-hhmm").checked = state.showHHMM;
        document.getElementById("tog-sec").checked = state.showSec;

        const dsSlider = document.getElementById("date-size");
        dsSlider.value = state.dateSize;
        document.getElementById("date-size-val").textContent =
          state.dateSize + "%";

        const tsSlider = document.getElementById("time-size");
        tsSlider.value = state.timeSize;
        document.getElementById("time-size-val").textContent =
          state.timeSize + "%";

        if (state.src === "ntp" && state.ntpOffset === 0) {
          ntpStatus.textContent = "（未取得）";
          ntpStatus.className = "loading";
        }
      }

      /* =============================================
   イベント
   ============================================= */
      document.querySelectorAll("input[name=src]").forEach((r) => {
        r.addEventListener("change", async () => {
          state.src = r.value;
          if (state.src === "ntp") {
            await fetchNTP();
          } else {
            ntpStatus.textContent = "";
            ntpStatus.className = "";
          }
          await saveSettings();
        });
      });

      document
        .getElementById("tog-date")
        .addEventListener("change", async (e) => {
          state.showDate = e.target.checked;
          applyDisplay();
          await saveSettings();
        });
      document
        .getElementById("tog-hhmm")
        .addEventListener("change", async (e) => {
          state.showHHMM = e.target.checked;
          applyDisplay();
          await saveSettings();
        });
      document
        .getElementById("tog-sec")
        .addEventListener("change", async (e) => {
          state.showSec = e.target.checked;
          applyDisplay();
          await saveSettings();
        });

      document
        .getElementById("date-size")
        .addEventListener("input", async (e) => {
          state.dateSize = parseInt(e.target.value);
          document.getElementById("date-size-val").textContent =
            state.dateSize + "%";
          applyDateSize();
          await saveSettings();
        });

      document
        .getElementById("time-size")
        .addEventListener("input", async (e) => {
          state.timeSize = parseInt(e.target.value);
          document.getElementById("time-size-val").textContent =
            state.timeSize + "%";
          applyTimeSize();
          await saveSettings();
        });

      /* =============================================
   歯車UI
   ============================================= */
      let hideTimer = null;

      function showUI() {
        gearBtn.classList.add("visible");
        document.body.style.cursor = "default";
        clearTimeout(hideTimer);
        hideTimer = setTimeout(hideUI, 5000);
      }

      function hideUI() {
        if (panel.classList.contains("open")) {
          hideTimer = setTimeout(hideUI, 5000);
          return;
        }
        gearBtn.classList.remove("visible");
        document.body.style.cursor = "none";
      }

      document.addEventListener("mousemove", showUI);
      document.addEventListener("touchstart", showUI, { passive: true });

      gearBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        panel.classList.toggle("open");
        clearTimeout(hideTimer);
      });

      document.addEventListener("click", (e) => {
        if (!panel.contains(e.target) && e.target !== gearBtn) {
          panel.classList.remove("open");
          clearTimeout(hideTimer);
          hideTimer = setTimeout(hideUI, 5000);
        }
      });

      panel.addEventListener("mousemove", () => clearTimeout(hideTimer));

      /* =============================================
   起動
   ============================================= */
      (async () => {
        await loadSettings();
        syncUIFromState();
        applyAll();

        // NTPモードで起動した場合は自動取得
        if (state.src === "ntp") {
          fetchNTP(); // await不要、バックグラウンドで取得
        }

        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
</html>
