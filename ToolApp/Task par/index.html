<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課題進捗チェッカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="battery-display" id="batteryDisplay">🔋 --%</div>

  <h1>課題進捗チェッカー</h1>

  <div class="clock-display" id="clockDisplay">00:00:00</div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="percentage-text" id="percentDisplay">0.0%</div>

  <div class="tasks-wrapper" id="tasksWrapper">
    <div id="taskList"></div>

    <button class="btn-primary btn-add-task" onclick="openTaskModal()">＋ 新しい課題を追加</button>
  </div>
</div>

<div class="modal-overlay" id="taskModal">
  <div class="modal-content">
    <h2 id="modalTitle">課題の追加</h2>
    <form id="taskForm" onsubmit="saveTask(event)">
      <input type="hidden" id="taskId">
      
      <div class="form-group">
        <label for="taskName">課題名</label>
        <input type="text" id="taskName" placeholder="例: 数学 夏季テキスト" required>
      </div>

      <div class="form-group">
        <label for="totalPages">総ページ数 (p)</label>
        <input type="number" id="totalPages" min="1" placeholder="例: 30" required>
      </div>

      <div class="form-group">
        <label for="pageTime">1ページあたりの所要時間 (分)</label>
        <input type="number" id="pageTime" min="1" placeholder="例: 15" required>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-sub" onclick="closeTaskModal()">キャンセル</button>
        <button type="button" class="btn-danger" id="btnDeleteTask" onclick="deleteTask()" style="display: none;">削除</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
