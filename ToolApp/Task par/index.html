<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク進捗管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="battery-display" id="batteryDisplay">🔋 --%</div>

  <h1>タスク進捗管理</h1>

  <div class="display-container" id="displayContainer">
    <div class="main-display" id="mainDisplay">00:00:00</div>
    <div class="sub-display" id="subDisplay"></div>
  </div>

  <div class="display-mode-selector">
    <label>表示設定:</label>
    <select id="displayModeSelect" onchange="changeDisplayMode(this.value)">
      <option value="countdown">⏳ 直近の期限カウントダウン</option>
      <option value="clock">⏰ リアルタイム時計</option>
      <option value="none">🙈 表示なし</option>
    </select>
  </div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="percentage-text" id="percentDisplay">0.0%</div>
  <div class="summary-text" id="summaryDisplay">総作業時間: 0分 / 完了済み時間: 0分</div>

  <div class="section-container">
    <label for="sectionSelect">タスクリスト:</label>
    <select id="sectionSelect" onchange="changeSection(this.value)"></select>
    <button id="addSectionButton" type="button" class="btn-sub btn-add-section" onclick="showSectionInput()">＋ 新しいタスクリスト</button>
    <button type="button" class="btn-sub btn-list-settings" onclick="toggleTaskListSettings()">リスト設定</button>
    <div class="section-add-form" id="sectionAddForm">
      <input id="newSectionName" type="text" placeholder="タスクリスト名">
      <button type="button" class="btn-primary btn-small" onclick="createSection()">作成</button>
      <button type="button" class="btn-sub btn-small" onclick="hideSectionInput()">キャンセル</button>
    </div>
    <div class="section-settings" id="sectionSettings" style="display:none;">
      <div class="section-settings-row">
        <button type="button" class="btn-sub btn-small" onclick="showRenameTaskListForm()">名前変更</button>
        <button type="button" class="btn-sub btn-small" onclick="confirmDeleteTaskList()">削除</button>
        <button type="button" class="btn-sub btn-small" onclick="showMergeTaskListForm()">統合</button>
        <button type="button" class="btn-sub btn-small" onclick="hideSectionSettings()">閉じる</button>
      </div>
      <div class="section-share-info" id="sectionShareInfo">共有されていません。</div>
      <div class="section-settings-row">
        <button type="button" class="btn-primary btn-small" onclick="shareTaskList()">共有する</button>
        <button type="button" class="btn-sub btn-small" onclick="loadSharedTaskList()">最新を取得</button>
      </div>
      <div class="section-settings-form" id="sectionRenameForm" style="display:none; margin-top: 8px; gap: 6px; align-items: center;">
        <input id="sectionRenameInput" type="text" placeholder="新しいタスクリスト名">
        <button type="button" class="btn-primary btn-small" onclick="renameTaskListFromInput()">変更</button>
        <button type="button" class="btn-sub btn-small" onclick="hideSectionRenameForm()">キャンセル</button>
      </div>
      <div class="section-settings-form" id="sectionMergeForm" style="display:none; margin-top: 8px; gap: 6px; align-items: center;">
        <select id="sectionMergeTarget"></select>
        <button type="button" class="btn-primary btn-small" onclick="mergeTaskListFromSelect()">統合</button>
        <button type="button" class="btn-sub btn-small" onclick="hideSectionMergeForm()">キャンセル</button>
      </div>
    </div>
  </div>

  <div class="tasks-wrapper" id="tasksWrapper">
    <div class="sort-container">
      <div class="search-box">
        <input id="taskSearch" type="text" placeholder="🔎 タスクを検索" oninput="updateSearchQuery(this.value)">
        <button type="button" class="search-clear" onclick="clearSearch()">×</button>
      </div>
      <label for="sortSelect">並び順:</label>
      <select id="sortSelect" onchange="changeSortMode(this.value)">
        <option value="deadline">📅 期限順 (近い順)</option>
        <option value="added">🆕 追加順</option>
        <option value="name">🔤 名前順</option>
        <option value="progressAsc">📉 進捗が低い順</option>
        <option value="progressDesc">📈 進捗が高い順</option>
      </select>
    </div>

    <div id="taskList"></div>

    <button class="btn-primary btn-add-task" onclick="openTaskModal()">＋ 新しいタスクを追加</button>
  </div>
</div>

<div class="modal-overlay" id="taskModal">
  <div class="modal-content">
    <h2 id="modalTitle">タスクの追加</h2>
    <form id="taskForm" onsubmit="saveTask(event)">
      <input type="hidden" id="taskId">
      
      <div class="form-group">
        <label for="taskName">タスク名</label>
        <input type="text" id="taskName" placeholder="例: 数学レポート / 部屋の掃除" required>
      </div>

      <div class="form-group-row">
        <div class="form-group">
          <label for="totalPages">作業量</label>
          <input type="number" id="totalPages" min="1" placeholder="単発なら1 (空欄可)">
        </div>
        <div class="form-group">
          <label for="unitName">単位</label>
          <select id="unitName">
            <option value="p">p (ページ)</option>
            <option value="回">回</option>
            <option value="個">個</option>
            <option value="章">章</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="pageTime">1単位あたりの所要時間 (分)</label>
        <input type="number" id="pageTime" min="1" placeholder="例: 15" required>
      </div>

      <div class="form-group">
        <label>提出期限 (任意)</label>
        <div class="datetime-inputs">
          <input type="date" id="deadlineDate">
          <input type="time" id="deadlineTime">
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label><input type="checkbox" id="taskPinned"> ピン留め</label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-sub" onclick="closeTaskModal()">キャンセル</button>
        <button type="button" class="btn-danger" id="btnDeleteTask" onclick="deleteTask()" style="display: none;">削除</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
