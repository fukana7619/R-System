<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATTERY // 残量監視</title>
<style>
  :root{
    --bg: #050505;
    --bg-2: #0d0d0d;
    --line: #1c1c1c;
    --text: #eaeaea;
    --dim: #6b6b6b;
    --accent: #39ff88;
    --accent-dim: #1c6b3f;
    --warn: #ffb020;
    --danger: #ff4d4d;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(57,255,136,0.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(57,255,136,0.04), transparent 40%);
  }

  .frame {
    width: 100%;
    max-width: 560px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    position: relative;
  }

  .frame::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border: 1px solid rgba(57,255,136,0.08);
    margin: 6px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-transform: uppercase;
  }

  .brand b { color: var(--text); }

  .status-dot {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dim);
  }

  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.danger { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  .body-area { padding: 30px 22px 22px; }

  /* 円形ゲージ */
  .gauge-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 8px;
  }

  .gauge {
    position: relative;
    width: 240px;
    height: 240px;
  }

  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .gauge-track { fill: none; stroke: var(--line); stroke-width: 10; }
  .gauge-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: butt;
    transition: stroke-dashoffset 0.6s ease, stroke 0.6s ease;
  }

  .gauge-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .pct {
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .pct-sign { font-size: 22px; color: var(--dim); margin-left: 2px; }

  .charging-tag {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .charging-tag.off { color: var(--dim); }

  .bolt { font-size: 12px; }

  /* タイマー表示 */
  .timer-block {
    margin-top: 26px;
    border-top: 1px dashed var(--line);
    padding-top: 20px;
  }

  .timer-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }

  .timer-digits {
    display: flex;
    justify-content: center;
    gap: 6px;
    font-variant-numeric: tabular-nums;
  }

  .digit-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .digit-value {
    font-size: 40px;
    font-weight: 700;
    background: #0a0a0a;
    border: 1px solid var(--line);
    padding: 6px 10px;
    min-width: 64px;
    text-align: center;
    color: var(--text);
  }

  .digit-unit {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--dim);
    margin-top: 6px;
    text-transform: uppercase;
  }

  .colon {
    font-size: 32px;
    color: var(--dim);
    align-self: center;
    padding-bottom: 22px;
  }

  .eta-line {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--dim);
  }

  .eta-line b { color: var(--text); font-weight: 600; }

  /* 詳細情報 */
  .details {
    margin-top: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .detail-cell {
    background: var(--bg-2);
    padding: 12px 14px;
  }

  .detail-cell .k {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 4px;
  }

  .detail-cell .v {
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  footer {
    padding: 14px 22px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    color: var(--dim);
    line-height: 1.6;
  }

  footer a { color: var(--accent); text-decoration: none; }

  .manual-panel {
    margin-top: 20px;
    border: 1px dashed var(--line);
    padding: 14px;
    display: none;
  }

  .manual-panel.show { display: block; }

  .manual-panel .k {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 8px;
  }

  .manual-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .manual-row label {
    font-size: 11px;
    color: var(--dim);
    min-width: 70px;
  }

  .manual-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    min-width: 100px;
  }

  .manual-row input[type="number"] {
    width: 64px;
    background: #0a0a0a;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    padding: 4px 6px;
    font-size: 12px;
  }

  .toggle-btn {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 5px 10px;
    cursor: pointer;
  }

  .toggle-btn:hover { background: rgba(57,255,136,0.08); }

  .charge-toggle {
    display: flex;
    gap: 8px;
  }

  @media (max-width: 480px) {
    .gauge { width: 190px; height: 190px; }
    .pct { font-size: 40px; }
    .digit-value { font-size: 28px; min-width: 48px; padding: 6px 6px; }
    .colon { font-size: 22px; padding-bottom: 16px; }
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <div class="brand"><b>BATTERY</b>/MONITOR</div>
    <div class="status-dot"><span class="dot" id="statusDot"></span><span id="statusText">検出中...</span></div>
  </header>

  <div class="body-area">

    <div class="gauge-wrap">
      <div class="gauge">
        <svg viewBox="0 0 240 240">
          <circle class="gauge-track" cx="120" cy="120" r="104"></circle>
          <circle class="gauge-fill" id="gaugeFill" cx="120" cy="120" r="104"
            stroke-dasharray="653.45" stroke-dashoffset="653.45"></circle>
        </svg>
        <div class="gauge-center">
          <div class="pct"><span id="pctValue">--</span><span class="pct-sign">%</span></div>
          <div class="charging-tag off" id="chargingTag"><span class="bolt">⚡</span><span id="chargingText">状態不明</span></div>
        </div>
      </div>
    </div>

    <div class="timer-block">
      <div class="timer-label">
        <span id="timerModeLabel">満充電まで</span>
        <span id="timerStateLabel">残り時間 / SEC計算</span>
      </div>
      <div class="timer-digits">
        <div class="digit-group">
          <div class="digit-value" id="hh">--</div>
          <div class="digit-unit">HOURS</div>
        </div>
        <div class="colon">:</div>
        <div class="digit-group">
          <div class="digit-value" id="mm">--</div>
          <div class="digit-unit">MIN</div>
        </div>
        <div class="colon">:</div>
        <div class="digit-group">
          <div class="digit-value" id="ss">--</div>
          <div class="digit-unit">SEC</div>
        </div>
      </div>
      <div class="eta-line" id="etaLine">到達予定時刻を計算中...</div>
    </div>

    <div class="details">
      <div class="detail-cell">
        <div class="k">現在時刻</div>
        <div class="v" id="nowClock">--:--:--</div>
      </div>
      <div class="detail-cell">
        <div class="k">合計秒数（残/充）</div>
        <div class="v" id="totalSeconds">-- 秒</div>
      </div>
    </div>

    <div class="manual-panel" id="manualPanel">
      <div class="k">手動シミュレーション（このブラウザは実バッテリー値を取得できません）</div>
      <div class="manual-row">
        <label for="rangeLevel">残量</label>
        <input type="range" id="rangeLevel" min="0" max="100" value="62">
        <input type="number" id="numLevel" min="0" max="100" value="62">
        <span style="color:var(--dim); font-size:12px;">%</span>
      </div>
      <div class="manual-row">
        <label>状態</label>
        <div class="charge-toggle">
          <button class="toggle-btn" id="btnCharging">充電中にする</button>
          <button class="toggle-btn" id="btnDischarging">放電中にする</button>
        </div>
      </div>
      <div class="manual-row">
        <label for="rangeRate">増減速度</label>
        <input type="range" id="rangeRate" min="1" max="20" value="5">
        <span style="color:var(--dim); font-size:11px;" id="rateLabel">1% / 5秒</span>
      </div>
    </div>

  </div>

  <footer id="footerNote">
    Battery Status API に接続中です。対応ブラウザでは実際の残量・充放電速度から算出します。
  </footer>
</div>

<script>
(function(){
  const el = {
    dot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    pct: document.getElementById('pctValue'),
    gaugeFill: document.getElementById('gaugeFill'),
    chargingTag: document.getElementById('chargingTag'),
    chargingText: document.getElementById('chargingText'),
    timerModeLabel: document.getElementById('timerModeLabel'),
    hh: document.getElementById('hh'),
    mm: document.getElementById('mm'),
    ss: document.getElementById('ss'),
    etaLine: document.getElementById('etaLine'),
    nowClock: document.getElementById('nowClock'),
    totalSeconds: document.getElementById('totalSeconds'),
    manualPanel: document.getElementById('manualPanel'),
    footerNote: document.getElementById('footerNote'),
    rangeLevel: document.getElementById('rangeLevel'),
    numLevel: document.getElementById('numLevel'),
    btnCharging: document.getElementById('btnCharging'),
    btnDischarging: document.getElementById('btnDischarging'),
    rangeRate: document.getElementById('rangeRate'),
    rateLabel: document.getElementById('rateLabel'),
  };

  const CIRCUMFERENCE = 2 * Math.PI * 104;
  el.gaugeFill.setAttribute('stroke-dasharray', CIRCUMFERENCE.toFixed(2));

  let mode = 'real'; // 'real' | 'manual'
  let battery = null;

  // --- 自前計測用の変数 ---
  let lastRecordedLevel = null;
  let lastRecordedTime = null;
  let secondsPerPercent = null;
  let isFirstChange = true; // 起動直後の端数を捨てるフラグ
  let estimatedTargetTimestamp = null; // ゴール（100% または 0%）の予定時刻(ミリ秒)

  // 手動モードの内部状態
  let manual = {
    level: 62,
    charging: false,
    ratePercentPerNSec: { percent: 1, seconds: 5 },
    lastTick: Date.now(),
  };

  function pad(n){ return String(Math.max(0, Math.floor(n))).padStart(2, '0'); }

  function formatClock(date){
    return date.getHours().toString().padStart(2,'0') + ':' +
           date.getMinutes().toString().padStart(2,'0') + ':' +
           date.getSeconds().toString().padStart(2,'0');
  }

  function setGauge(level, charging){
    const clamped = Math.min(100, Math.max(0, level));
    const offset = CIRCUMFERENCE * (1 - clamped/100);
    el.gaugeFill.style.strokeDashoffset = offset.toFixed(2);

    let color = 'var(--accent)';
    let dotClass = 'on';
    if(!charging && clamped <= 15){
      color = 'var(--danger)';
      dotClass = 'danger';
    } else if(!charging && clamped <= 30){
      color = 'var(--warn)';
      dotClass = 'warn';
    }
    el.gaugeFill.style.stroke = color;
    el.dot.className = 'dot ' + dotClass;
  }

  function renderLevel(levelFloat, charging){
    const levelInt = Math.round(levelFloat);
    el.pct.textContent = levelInt;
    setGauge(levelFloat, charging);

    if(charging){
      el.chargingTag.classList.remove('off');
      el.chargingText.textContent = '充電中';
    } else {
      el.chargingTag.classList.add('off');
      el.chargingText.textContent = levelInt <= 15 ? '放電中・残量僅か' : '放電中';
    }

    el.statusText.textContent = charging ? '充電中' : '稼働中（給電なし）';
  }

  function renderTimer(totalSeconds, charging, unknown){
    el.timerModeLabel.textContent = charging ? '満充電まで' : 'バッテリー切れまで';

    if(unknown || totalSeconds === Infinity || totalSeconds == null || isNaN(totalSeconds) || totalSeconds < 0){
      el.hh.textContent = '--';
      el.mm.textContent = '--';
      el.ss.textContent = '--';
      el.etaLine.textContent = secondsPerPercent === null ? '計測中...（1%以上変化すると計算を開始します）' : '推定時間を計算できません';
      el.totalSeconds.textContent = '-- 秒';
      return;
    }

    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = Math.floor(totalSeconds % 60);

    el.hh.textContent = pad(h);
    el.mm.textContent = pad(m);
    el.ss.textContent = pad(s);

    const eta = new Date(Date.now() + totalSeconds * 1000);
    el.etaLine.innerHTML = (charging ? '満充電予定時刻: ' : '推定切断時刻: ') +
      '<b>' + formatClock(eta) + '</b>（' + eta.getFullYear() + '/' + (eta.getMonth()+1) + '/' + eta.getDate() + '）';

    el.totalSeconds.textContent = Math.floor(totalSeconds).toLocaleString('ja-JP') + ' 秒';
  }

  function tickClock(){
    el.nowClock.textContent = formatClock(new Date());
  }

  // ---- 自前でのバッテリー消費/充電ペース計測ロジック ----
  function trackBatteryPace() {
    if (!battery) return;

    const now = Date.now();
    const currentLevel = battery.level * 100;

    if (lastRecordedLevel !== null && lastRecordedTime !== null) {
      const diffLevel = Math.abs(currentLevel - lastRecordedLevel);
      const diffTime = (now - lastRecordedTime) / 1000;

      if (diffLevel > 0) {
        if (isFirstChange) {
          isFirstChange = false; // 最初の変化（不規則な端数時間）は除外して精度を確保
        } else {
          // 純粋な 1% あたりの所要秒数を計算
          secondsPerPercent = diffTime / diffLevel;
        }
      }
    }

    lastRecordedLevel = currentLevel;
    lastRecordedTime = now;

    // ゴール時刻（タイムスタンプ）を更新
    if (secondsPerPercent !== null) {
      const remainingPercent = battery.charging ? (100 - currentLevel) : currentLevel;
      estimatedTargetTimestamp = now + (remainingPercent * secondsPerPercent * 1000);
    }
  }

  // ---- 実バッテリー（Battery Status API） ----
  function attachBatteryEvents(bat){
    battery = bat;

    bat.addEventListener('levelchange', () => {
      trackBatteryPace();
      updateFromReal();
    });

    bat.addEventListener('chargingchange', () => {
      // 状態変更時は計測用変数をリセット
      lastRecordedLevel = null;
      lastRecordedTime = null;
      secondsPerPercent = null;
      estimatedTargetTimestamp = null;
      isFirstChange = true;

      trackBatteryPace();
      updateFromReal();
    });

    trackBatteryPace();
    updateFromReal();
    el.footerNote.textContent = 'Battery Status API と自前計測ロジックを併用しています。1%ごとの変化速度から到達時間を独自計算しています。';
  }

  function updateFromReal(){
    if(!battery) return;
    const levelPct = battery.level * 100;
    renderLevel(levelPct, battery.charging);

    // リアルタイムでの残り秒数計算
    if (estimatedTargetTimestamp) {
      const remainingMs = estimatedTargetTimestamp - Date.now();
      const remainingSec = Math.max(0, remainingMs / 1000);
      renderTimer(remainingSec, battery.charging, false);
    } else {
      // まだ1%の変化が計測できていない場合
      renderTimer(null, battery.charging, true);
    }
  }

  function enterManualMode(reason){
    mode = 'manual';
    el.manualPanel.classList.add('show');
    el.statusText.textContent = '手動モード';
    el.footerNote.textContent = reason + ' 手動シミュレーションモードに切り替えました。下のスライダーで残量と速度を調整できます。';
    syncManualUIFromState();
    updateFromManual();
  }

  // ---- 手動シミュレーション ----
  function syncManualUIFromState(){
    el.rangeLevel.value = manual.level;
    el.numLevel.value = manual.level;
  }

  function updateFromManual(){
    renderLevel(manual.level, manual.charging);

    const secondsPerPercent = manual.ratePercentPerNSec.seconds / manual.ratePercentPerNSec.percent;
    let remainingSeconds;
    if(manual.charging){
      const remainPercent = 100 - manual.level;
      remainingSeconds = remainPercent <= 0 ? 0 : remainPercent * secondsPerPercent;
      renderTimer(remainingSeconds, true, manual.level >= 100);
    } else {
      const remainPercent = manual.level;
      remainingSeconds = remainPercent <= 0 ? 0 : remainPercent * secondsPerPercent;
      renderTimer(remainingSeconds, false, manual.level <= 0);
    }
  }

  function manualLoop(){
    if(mode !== 'manual') return;
    const now = Date.now();
    const elapsedSec = (now - manual.lastTick) / 1000;
    manual.lastTick = now;

    const secondsPerPercent = manual.ratePercentPerNSec.seconds / manual.ratePercentPerNSec.percent;
    const deltaPercent = elapsedSec / secondsPerPercent;

    if(manual.charging){
      manual.level = Math.min(100, manual.level + deltaPercent);
    } else {
      manual.level = Math.max(0, manual.level - deltaPercent);
    }
    syncManualUIFromState();
    updateFromManual();
  }

  // 手動UIイベント
  el.rangeLevel.addEventListener('input', () => {
    manual.level = Number(el.rangeLevel.value);
    el.numLevel.value = manual.level;
    updateFromManual();
  });
  el.numLevel.addEventListener('input', () => {
    let v = Number(el.numLevel.value);
    if(isNaN(v)) v = 0;
    v = Math.min(100, Math.max(0, v));
    manual.level = v;
    el.rangeLevel.value = v;
    updateFromManual();
  });
  el.btnCharging.addEventListener('click', () => {
    manual.charging = true;
    updateFromManual();
  });
  el.btnDischarging.addEventListener('click', () => {
    manual.charging = false;
    updateFromManual();
  });
  el.rangeRate.addEventListener('input', () => {
    const v = Number(el.rangeRate.value);
    manual.ratePercentPerNSec = { percent: 1, seconds: 21 - v };
    el.rateLabel.textContent = '1% / ' + (21 - v) + '秒';
    updateFromManual();
  });

  // ---- 初期化 ----
  function init(){
    if('getBattery' in navigator){
      navigator.getBattery().then(attachBatteryEvents).catch(() => {
        enterManualMode('バッテリー情報の取得に失敗しました。');
      });
    } else {
      enterManualMode('このブラウザは Battery Status API に対応していません。');
    }

    tickClock();
    setInterval(tickClock, 1000);
    setInterval(() => {
      if(mode === 'manual'){
        manualLoop();
      } else if(mode === 'real' && battery){
        // 1秒ごとに自前計算のカウントダウン表示を更新
        updateFromReal();
      }
    }, 1000);
  }

  init();
})();
</script>
</body>
</html>
