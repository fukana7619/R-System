<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充電残量</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #battery-level {
      /* 画面の幅・高さに合わせて文字サイズを最大化 */
      font-size: 35vw;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      text-align: center;
      user-select: none;
    }

    /* 充電中であることをわかりやすくするアニメーション効果（任意） */
    .charging {
      color: #34c759;
    }

    .error {
      font-size: 5vw;
      color: #ff3b30;
    }
  </style>
</head>
<body>

  <div id="battery-level">--%</div>

  <script>
    const batteryDisplay = document.getElementById('battery-level');

    async function initBattery() {
      // Battery Status APIに対応しているか確認
      if ('getBattery' in navigator) {
        try {
          const battery = await navigator.getBattery();

          // 残量を更新する関数
          function updateBatteryInfo() {
            const level = Math.round(battery.level * 100);
            batteryDisplay.textContent = `${level}%`;

            // 充電中なら文字色を緑色に変化
            if (battery.charging) {
              batteryDisplay.classList.add('charging');
            } else {
              batteryDisplay.classList.remove('charging');
            }
          }

          // 初期表示
          updateBatteryInfo();

          // 状態が変化した時のイベントリスナー
          battery.addEventListener('levelchange', updateBatteryInfo);
          battery.addEventListener('chargingchange', updateBatteryInfo);

        } catch (error) {
          batteryDisplay.textContent = '取得失敗';
          batteryDisplay.classList.add('error');
        }
      } else {
        // iOS Safariや一部の非対応ブラウザ向け
        batteryDisplay.textContent = '非対応';
        batteryDisplay.classList.add('error');
      }
    }

    initBattery();
  </script>
</body>
</html>
