<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充電残量</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* やわらかな淡いグラデーション背景 */
      background: linear-gradient(135deg, #fff5f5 0%, #eef2ff 100%);
      color: #5a5266; /* 濃すぎない優しいダークグレー */
      font-family: 'M PLUS Rounded 1c', sans-serif;
      overflow: hidden;
    }

    #battery-level {
      font-size: 30vw;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      user-select: none;
      /* ふんわり浮き出るようなソフトな影 */
      text-shadow: 0 12px 24px rgba(120, 110, 140, 0.12);
      transition: all 0.5s ease;
    }

    /* 充電中：優しいミントグリーン ＋ ゆっくり息をするようなアニメーション */
    #battery-level.charging {
      color: #48bb78;
      animation: breathe 3s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .error {
      font-size: 6vw;
      color: #f56565;
    }
  </style>
</head>
<body>

  <div id="battery-level">--%</div>

  <script>
    const batteryDisplay = document.getElementById('battery-level');

    async function initBattery() {
      if ('getBattery' in navigator) {
        try {
          const battery = await navigator.getBattery();

          function updateBatteryInfo() {
            const level = Math.round(battery.level * 100);
            batteryDisplay.textContent = `${level}%`;

            if (battery.charging) {
              batteryDisplay.classList.add('charging');
            } else {
              batteryDisplay.classList.remove('charging');
            }
          }

          updateBatteryInfo();
          battery.addEventListener('levelchange', updateBatteryInfo);
          battery.addEventListener('chargingchange', updateBatteryInfo);

        } catch (error) {
          batteryDisplay.textContent = '取得失敗';
          batteryDisplay.classList.add('error');
        }
      } else {
        batteryDisplay.textContent = '非対応';
        batteryDisplay.classList.add('error');
      }
    }

    initBattery();
  </script>
</body>
</html>
