<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>収支簿</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>

<div class="header">
  <h1>収支簿</h1>
  <div class="header-right">
    <div id="version-tag" class="version-display" style="display:none;">Ver -.-.-</div>
    <button class="refresh-btn" onclick="fetchDataAndCalculate(true)">最新の状態に更新</button>
    <button class="logout-btn" onclick="logout()">ログアウト</button>
  </div>
</div>

<div class="main-layout">
  <div class="left-col">
    <div class="card">
      <table class="user-filter-table">
        <tr>
          <td style="width: 40%; font-size: 0.85rem; color: #64748b;">
            ユーザー: <strong><span id="display-user">...</span></strong>
          </td>
          <td style="width: 60%; text-align: right; font-size: 0.85rem; color: #475569;">
            <label style="display:inline; margin-right:5px;">表示対象:</label>
            <select id="wallet-filter" class="filter-select" onchange="updateDashboardAndTable()">
              <option value="__all__">✨ 全体（全財産）</option>
            </select>
          </td>
        </tr>
      </table>
      
      <table class="dashboard-table" style="margin-top: 10px;">
        <tr>
          <td>
            <div class="dash-box">
              <div class="dash-title" id="balance-title">現在の残高</div>
              <div class="dash-value" id="current-balance">0円</div>
            </div>
          </td>
          <td>
            <div class="dash-box">
              <div class="dash-title" id="monthly-title">今月の収支合計</div>
              <div class="dash-value" id="monthly-expense">0円</div>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <div class="card">
      <h3 id="form-title">収支の入力</h3>
      
      <div class="form-group">
        <label for="date">日付</label>
        <input type="date" id="date">
      </div>

      <div class="form-group">
        <label for="origin-select">決済手段</label>
        <table class="input-row-table">
          <tr>
            <td>
              <select id="origin-select" onchange="toggleInput('origin')">
                <option value="__other__">その他（自由入力）</option>
              </select>
            </td>
            <td id="origin-text-cell" class="text-input-cell">
              <input type="text" id="origin-text" class="dynamic-text-input" placeholder="例: 現金, ICカード">
            </td>
          </tr>
        </table>
      </div>

      <div class="form-group">
        <table class="inline-group-table">
          <tr>
            <td>
              <label for="income">収入</label>
              <input type="number" id="income" placeholder="0" min="0">
            </td>
            <td>
              <label for="expense">支出</label>
              <input type="number" id="expense" placeholder="0" min="0">
            </td>
          </tr>
        </table>
      </div>

      <div class="form-group">
        <label for="usage-select">用途（使い道）</label>
        <table class="input-row-table">
          <tr>
            <td>
              <select id="usage-select" onchange="toggleInput('usage')">
                <option value="__other__">その他（自由入力）</option>
              </select>
            </td>
            <td id="usage-text-cell" class="text-input-cell">
              <input type="text" id="usage-text" class="dynamic-text-input" placeholder="例: 食費, 交通費">
            </td>
          </tr>
        </table>
      </div>

      <div class="form-group">
        <label for="content-select">内容（詳細）</label>
        <table class="input-row-table">
          <tr>
            <td>
              <select id="content-select" onchange="toggleInput('content')">
                <option value="__other__">その他（自由入力）</option>
              </select>
            </td>
            <td id="content-text-cell" class="text-input-cell">
              <input type="text" id="content-text" class="dynamic-text-input" placeholder="例: コンビニ, 文房具">
            </td>
          </tr>
        </table>
      </div>

      <button class="submit-btn" id="submit-button" onclick="addRecord()">記録する</button>
      <button class="submit-btn" id="cancel-button" onclick="cancelEdit()" style="display:none; background-color: #64748b; margin-top: 8px;">キャンセル</button>
      <div id="status"></div>
    </div>
  </div>

  <div class="right-col">
    <div class="card">
      <table class="history-header">
        <tr>
          <td><h3 style="margin:0; border-left:4px solid var(--primary-color); padding-left:8px;">履歴一覧</h3></td>
          <td style="text-align: right;"><a href="dashboard.html" class="analysis-btn">グラフ分析 📈</a></td>
        </tr>
      </table>
      
      <div class="table-container">
        <table id="history-table" class="data-table">
          <thead>
            <tr>
              <th style="width: 15%;">日付</th>
              <th style="width: 20%;">決済手段</th>
              <th style="width: 15%;">収入</th>
              <th style="width: 15%;">支出</th>
              <th style="width: 20%;">用途 / 内容</th>
              <th style="width: 15%; text-align: center;">操作</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div id="loading-overlay" class="loading-overlay" style="display: none;">
  <div class="spinner"></div>
</div>
</body>
</html>
