<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かけいぼ</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="navbar">
    <div class="nav-title">🏠 かけいぼ</div>
    <div class="nav-links">
      <span class="user-name">ユーザー: <span id="display-user">---</span></span>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container main-layout">
    
    <div class="left-col">
      
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <select id="wallet-filter" class="form-input" style="width: auto; margin: 0; padding: 5px 10px; font-size: 0.9rem;" onchange="updateDashboardAndTable()"></select>
          <button class="action-btn edit-btn" style="padding: 5px 12px; font-size: 0.85rem;" onclick="fetchDataAndCalculate(true, true)">最新の状態に更新</button>
        </div>
        
        <div class="dashboard">
          <div class="dash-box">
            <div class="dash-title" id="balance-title">現在の残高</div>
            <div class="dash-value" id="current-balance">0円</div>
          </div>
          <div class="dash-box">
            <div class="dash-title" id="monthly-title">今月の収支合計</div>
            <div class="dash-value" id="monthly-expense">0円</div>
          </div>
        </div>
        <div id="status" style="text-align: center; font-size: 0.85rem; margin-top: 8px; font-weight: bold;"></div>
      </div>

      <div class="card">
        <h2 id="form-title" style="margin-top: 0; color: var(--primary-color);">収支の入力</h2>
        <form id="finance-form" onsubmit="event.preventDefault(); addRecord();">
          
          <label class="form-label">📅 日付</label>
          <input type="date" id="date" class="form-input" required>

          <label class="form-label">👛 決済手段</label>
          <select id="origin-select" class="form-input" onchange="toggleInput('origin')"></select>
          <input type="text" id="origin-text" class="form-input" placeholder="新しい決済手段を入力" style="display:none;">

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
              <label class="form-label">📥 収入 (円)</label>
              <input type="number" id="income" class="form-input" placeholder="0" min="0">
            </div>
            <div>
              <label class="form-label">📤 支出 (円)</label>
              <input type="number" id="expense" class="form-input" placeholder="0" min="0">
            </div>
          </div>

          <label class="form-label">🏷️ 用途</label>
          <select id="usage-select" class="form-input" onchange="toggleInput('usage')"></select>
          <input type="text" id="usage-text" class="form-input" placeholder="新しい用途を入力" style="display:none;">

          <label class="form-label">📝 詳しい内容</label>
          <select id="content-select" class="form-input" onchange="toggleInput('content')"></select>
          <input type="text" id="content-text" class="form-input" placeholder="詳しい内容を入力" style="display:none;">

          <button type="submit" id="submit-button" class="submit-btn">記録する</button>
          <button type="button" id="cancel-button" class="cancel-btn" style="display:none;" onclick="cancelEdit()">修正をキャンセル</button>
        </form>
      </div>

    </div>

    <div class="right-col">
      <div class="card" style="height: 100%; display: flex; flex-direction: column; box-sizing: border-box;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="margin: 0; color: var(--primary-color);">📋 現在の履歴</h2>
          <a href="history.html" class="action-btn edit-btn" style="text-decoration: none; padding: 6px 14px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px;">
            📊 詳細検索・履歴
          </a>
        </div>
        
        <div class="table-wrapper" style="flex: 1; overflow-y: auto;">
          <table id="history-table">
            <thead>
              <tr>
                <th>日時</th>
                <th>決済</th>
                <th>収入</th>
                <th>支出</th>
                <th>用途</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              </tbody>
          </table>
        </div>
        
        <div id="version-tag" style="display: none; text-align: right; font-size: 0.75rem; color: #94a3b8; margin-top: 10px;"></div>
      </div>
    </div>

  </div>

  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
