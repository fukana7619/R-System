<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予定・定期収支管理</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <div class="header">
    <h1>📅 予定・定期収支の設定</h1>
    <div class="header-right">
      <a href="index.html" class="refresh-btn" style="text-decoration: none;">← 収支簿に戻る</a>
    </div>
  </div>

  <div class="main-layout">
    <div class="left-col">
      <div class="card">
        <h3>新しい予定・定期収支を登録</h3>
        
        <div class="form-group">
          <label for="sched-type">繰り返しタイプ</label>
          <select id="sched-type" onchange="toggleScheduleFields()">
            <option value="single">単発（指定日に1回だけ）</option>
            <option value="monthly">毎月（指定日）</option>
            <option value="weekly">毎週（指定曜日）</option>
            <option value="yearly">毎年（指定月日）</option>
          </select>
        </div>

        <div class="form-group" id="field-date">
          <label for="sched-date">指定日</label>
          <input type="date" id="sched-date">
        </div>

        <div class="form-group" id="field-dayofmonth" style="display:none;">
          <label for="sched-dayofmonth">毎月の日にち</label>
          <select id="sched-dayofmonth">
            </select>
        </div>

        <div class="form-group" id="field-dayofweek" style="display:none;">
          <label for="sched-dayofweek">毎週の曜日</label>
          <select id="sched-dayofweek">
            <option value="1">月曜日</option>
            <option value="2">火曜日</option>
            <option value="3">水曜日</option>
            <option value="4">木曜日</option>
            <option value="5">金曜日</option>
            <option value="6">土曜日</option>
            <option value="0">日曜日</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sched-origin">決済手段</label>
          <input type="text" id="sched-origin" placeholder="例: 銀行口座、PayPay">
        </div>

        <table class="inline-group-table form-group">
          <tr>
            <td>
              <label for="sched-income">収入 (円)</label>
              <input type="number" id="sched-income" placeholder="0">
            </td>
            <td>
              <label for="sched-expense">支出 (円)</label>
              <input type="number" id="sched-expense" placeholder="0">
            </td>
          </tr>
        </table>

        <div class="form-group">
          <label for="sched-usage">用途</label>
          <input type="text" id="sched-usage" placeholder="例: 給料、サブスク、家賃">
        </div>

        <div class="form-group">
          <label for="sched-content">詳細メモ</label>
          <input type="text" id="sched-content" placeholder="例: Netflix月額">
        </div>

        <button class="submit-btn" onclick="addSchedule()">予定を追加する</button>
        <div id="status"></div>
      </div>
    </div>

    <div class="right-col">
      <div class="card">
        <h3>登録済みの予定一覧</h3>
        <div class="table-container">
          <table class="data-table" id="schedule-table">
            <thead>
              <tr>
                <th>条件</th>
                <th>決済</th>
                <th>金額</th>
                <th>用途/詳細</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="schedule.js"></script>
</body>
</html>
