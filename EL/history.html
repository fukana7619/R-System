<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細履歴 - 収支簿</title>
  <link rel="stylesheet" href="index.css">
  <script src="history.js" defer></script>
  
  <style>
    /* 枠の中の各アイテム（チェックボックス＋文字）を横並びにする */
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    /* index.cssの width: 100% をチェックボックスだけ打ち消す */
    .checkbox-item input[type="checkbox"] {
      width: auto !important;
      margin: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>詳細検索・履歴</h1>
  <div class="header-right">
    <a href="index.html" class="refresh-btn" style="text-decoration: none;">← 収支簿に戻る</a>
  </div>
</div>

<div class="main-layout" style="flex-direction: column; max-width: 1200px;">
  
  <div class="card">
    <h3 style="margin-top: 0;">🔍 履歴の絞り込み条件</h3>
    
    <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px;">
      
      <div style="flex: 1; min-width: 250px;">
        <label>📅 期間指定</label>
        <div style="display: flex; align-items: center; gap: 5px;">
          <input type="date" id="filter-start-date" style="padding: 6px;">
          <span>〜</span>
          <input type="date" id="filter-end-date" style="padding: 6px;">
        </div>
        <button type="button" class="action-btn edit-btn" style="margin-top: 8px; padding: 4px 10px;" onclick="clearDateFilter()">全期間にする</button>
      </div>

      <div style="flex: 1; min-width: 250px;">
        <label>💰 金額（しきい値）</label>
        <div style="display: flex; align-items: center; gap: 5px;">
          <input type="number" id="filter-min-amount" placeholder="0" min="0">
          <span style="white-space: nowrap;">円以上のみ表示</span>
        </div>
      </div>

    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px;">
      
      <div style="flex: 1; min-width: 200px;">
        <label>👛 決済手段（複数選択）</label>
        <div id="origin-checkboxes" style="max-height: 120px; overflow-y: auto; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; background: #fafafa;">
          </div>
      </div>

      <div style="flex: 1; min-width: 200px;">
        <label>🏷️ 用途（複数選択）</label>
        <div id="usage-checkboxes" style="max-height: 120px; overflow-y: auto; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; background: #fafafa;">
          </div>
      </div>

    </div>

    <div style="text-align: right; margin-top: 15px;">
      <button class="submit-btn" style="width: auto; padding: 8px 30px;" onclick="applyFilters()">この条件で検索する</button>
    </div>
  </div>

  <div class="card">
    <table class="history-header">
      <tr>
        <td>
          <h3 style="margin:0;">📋 該当データ一覧 (<span id="match-count">0</span>件)</h3>
        </td>
        <td style="text-align: right; font-size: 0.9rem; font-weight: bold; color: #475569;">
          合計収入: <span id="sum-income" class="income-text">0円</span> | 
          合計支出: <span id="sum-expense" class="expense-text">0円</span>
        </td>
      </tr>
    </table>

    <div class="table-container">
      <table id="history-table" class="data-table">
        <thead>
          <tr>
            <th style="width: 15%;">日付</th>
            <th style="width: 20%;">決済手段</th>
            <th style="width: 15%;">収入</th>
            <th style="width: 15%;">支出</th>
            <th style="width: 35%;">用途 / 内容</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>
  </div>

</div>

<div id="loading-overlay" class="loading-overlay" style="display: none;">
  <div class="spinner"></div>
</div>
</body>
</html>
