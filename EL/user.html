<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>収支簿 - ログイン</title>
  <style>
    :root {
      /* 💡 本体のテーマカラーである深緑に統一しました */
      --primary-color: #0f766e;
      --primary-hover: #0d615a;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #e2e8f0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      width: 90%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: var(--primary-color);
      font-size: 1.4rem;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #475569;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
      background-color: #fafafa;
    }
    input:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #ffffff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .success { color: #0f766e; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>

<div class="container">
  <h2>🔑 収支簿 ログイン</h2>
  <p style="font-size: 0.8rem; color: #64748b; text-align: center; margin-bottom: 20px; line-height: 1.4;">
    スプレッドシートの「ユーザーデータ」に登録したIDとパスワードを入力してください。
  </p>
  
  <div class="form-group">
    <label for="userId">ログインID</label>
    <input type="text" id="userId" placeholder="例: jiro">
  </div>
  
  <div class="form-group">
    <label for="password">パスワード</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>
  
  <button onclick="saveAndTest()">ログイン</button>
  
  <div id="status"></div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxYb_SOQDiw-k30HciJfRMQvIp66dhoddcJa7Rn7bipj_PTlS8K2UsHPJY3MhEiwMMAaA/exec";

  window.onload = function() {
    document.getElementById('userId').value = localStorage.getItem('user_id') || '';
    document.getElementById('password').value = localStorage.getItem('user_password') || '';
  };

  async function saveAndTest() {
    const userId = document.getElementById('userId').value.trim();
    const password = document.getElementById('password').value.trim();
    const statusDiv = document.getElementById('status');

    if (!userId || !password) {
      statusDiv.className = 'error';
      statusDiv.innerText = '⚠️ すべての項目を入力してください。';
      return;
    }

    statusDiv.className = '';
    statusDiv.innerText = '⏳ 接続テスト中...';

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          id: userId,
          password: password,
          cmd: 'test'
        })
      });

      const result = await response.text();

      if (result === 'OK') {
        localStorage.setItem('gas_url', GAS_URL);
        localStorage.setItem('user_id', userId);
        localStorage.setItem('user_password', password);

        statusDiv.className = 'success';
        statusDiv.innerText = '🎉 ログイン成功！ 移動します...';
        
        setTimeout(() => {
          location.href = 'index.html';
        }, 1500);

      } else if (result === 'Authentication failed') {
        statusDiv.className = 'error';
        statusDiv.innerText = '❌ ユーザーIDまたはパスワードが違います。';
      } else {
        statusDiv.className = 'error';
        statusDiv.innerText = `❌ エラー: ${result}`;
      }
    } catch (err) {
      statusDiv.className = 'error';
      statusDiv.innerText = '⚠️ GASとの通信に失敗しました。GASのデプロイ状態や設定を確認してください。';
      console.error(err);
    }
  }
</script>

</body>
</html>
